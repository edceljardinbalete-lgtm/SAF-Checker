<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SUPPORT PERFORMANCE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,400;0,500;0,600;0,700;0,800;1,500&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root{
    --pal-navy:#093C5D;
    --pal-blue:#3B7597;
    --pal-teal:#6FD1D7;
    --pal-mint:#5DF8D8;

    --ink:#093C5D;
    --ink-2:#3B7597;
    --ink-soft:#2c5470;
    --paper:#d9eef0;
    --paper-deep:#c4e3e6;
    --card:#f7fdfd;
    --rule:#b3d8db;
    --rule-soft:#cbe6e8;
    --brass:#3B7597;
    --brass-dark:#26506b;
    --brass-tint:#d7f2f0;
    --ink-text:#093C5D;
    --slate:#365f6e;
    --slate-soft:#6c959e;
    --green:#0d6b5c;
    --green-bg:#8ff0dd;
    --red:#8f2f2f;
    --red-bg:#f6c9c9;
    --amber:#7a5e10;
    --amber-bg:#f5dd8f;
    --neutral-ink:#2c5f68;
    --neutral-bg:#cdeceb;
    --radius:10px;
    --radius-sm:6px;
    --shadow: 0 1px 2px rgba(9,60,93,0.06), 0 4px 16px rgba(9,60,93,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink-text);
    font-family:'Inter', -apple-system, sans-serif;
    font-size:14.5px;
    line-height:1.5;
    min-height:100vh;
  }
  ::selection{ background: var(--brass); color:#fff; }
  .app{
    display:flex;
    min-height:100vh;
  }

  /* ---------- SIDEBAR ---------- */
  .sidebar{
    width:242px;
    flex-shrink:0;
    background: linear-gradient(180deg, var(--ink) 0%, var(--ink-2) 100%);
    border-right:1px solid rgba(255,255,255,0.06);
    color:#dcefe9;
    display:flex;
    flex-direction:column;
    position:sticky;
    top:0;
    height:100vh;
  }
  .brand{
    padding:26px 22px 18px 22px;
    border-bottom:1px solid rgba(255,255,255,0.1);
  }
  .brand .mark{
    display:flex; align-items:center; gap:10px; margin-bottom:6px;
  }
  .brand .seal{
    width:30px;height:30px;border-radius:50%;
    background:rgba(93,248,216,0.14);
    border:1px solid var(--pal-mint);
    display:flex;align-items:center;justify-content:center;
    font-family:'Inter',sans-serif; font-weight:700; font-size:12.5px; color:var(--pal-mint);
    flex-shrink:0;
  }
  .brand h1{
    font-family:'Inter',sans-serif;
    font-weight:800;
    font-size:18px;
    letter-spacing:-0.01em;
    margin:0;
    color:#f2fbf8;
  }
  .brand .tagline{
    font-size:10.5px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:#7fa39b;
    margin-top:3px;
  }
  .mode-toggle{
    display:flex; align-items:center; gap:2px; margin-top:14px;
    background:rgba(255,255,255,0.06); border:1px solid rgba(255,255,255,0.12); border-radius:20px; padding:3px;
    width:fit-content;
  }
  .mode-toggle button{
    display:flex; align-items:center; gap:5px; border:none; background:none; cursor:pointer;
    font-family:inherit; font-size:11px; font-weight:600; color:#8aa9a3;
    padding:6px 11px; border-radius:16px; transition:background 0.15s, color 0.15s;
  }
  .mode-toggle button.active{ background:var(--pal-mint); color:var(--pal-navy); }
  .mode-toggle button svg{ flex-shrink:0; }
  .viewer-picker{ margin-top:14px; }
  .viewer-picker label{
    font-size:10px; text-transform:uppercase; letter-spacing:0.1em; color:#7fa39b; display:block; margin-bottom:5px; font-weight:700;
  }
  .viewer-picker select{
    width:100%; background:#ffffff; border:1px solid rgba(255,255,255,0.5); color:var(--pal-navy);
    font-size:13px; font-weight:600; padding:9px 30px 9px 11px; border-radius:var(--radius-sm); cursor:pointer;
    appearance:none; -webkit-appearance:none; -moz-appearance:none;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%23093C5D' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat:no-repeat; background-position:right 9px center;
  }
  .viewer-picker select option{ background:#ffffff; color:var(--pal-navy); }
  .type-badge{
    display:inline-flex; align-items:center; font-size:11px; font-weight:600; padding:3px 9px; border-radius:20px;
    background:var(--brass-tint); color:var(--brass-dark); white-space:nowrap;
  }
  .type-badge.commendation{ background:var(--green-bg); color:var(--green); }
  .kind-tabs{ display:inline-flex; gap:4px; padding:4px; background:var(--paper-deep); border:1px solid var(--rule); border-radius:24px; margin-bottom:20px; }
  .kind-tabs button{
    display:flex; align-items:center; gap:7px; border:none; background:none; cursor:pointer;
    font-family:inherit; font-size:13px; font-weight:600; color:var(--slate); padding:9px 18px; border-radius:20px;
    transition:background 0.15s, color 0.15s;
  }
  .kind-tabs button.active[data-kind="review"]{ background:var(--amber-bg); color:var(--amber); }
  .kind-tabs button.active[data-kind="commendation"]{ background:var(--green-bg); color:var(--green); }
  .kind-count-row{ display:flex; gap:14px; margin-bottom:20px; flex-wrap:wrap; }
  .kind-count-pill{
    display:flex; align-items:center; gap:8px; background:var(--card); border:1px solid var(--rule-soft);
    border-radius:var(--radius); padding:12px 18px; box-shadow:var(--shadow);
  }
  .kind-count-pill .num{ font-family:'IBM Plex Mono',monospace; font-size:19px; font-weight:700; color:var(--ink-text); }
  .kind-count-pill .lbl{ font-size:11.5px; color:var(--slate-soft); }
  .section-hint{ font-size:11.5px; color:var(--slate-soft); font-weight:400; text-transform:none; letter-spacing:0; display:block; margin-top:2px; }
  nav.navlist{
    padding:16px 12px;
    flex:1;
    overflow-y:auto;
  }
  .navlist button{
    width:100%;
    display:flex;
    align-items:center;
    gap:11px;
    background:none;
    border:none;
    color:#a9c9c2;
    text-align:left;
    font-family:inherit;
    font-size:13.5px;
    font-weight:500;
    padding:9px 12px;
    border-radius:var(--radius-sm);
    cursor:pointer;
    letter-spacing:0.01em;
    margin-bottom:2px;
    transition:background 0.15s, color 0.15s;
  }
  .navlist button svg{ flex-shrink:0; opacity:0.75; }
  .navlist button:hover{ background:rgba(255,255,255,0.06); color:#f2fbf8; }
  .navlist button.active{
    background:rgba(93,248,216,0.16);
    color:var(--pal-mint);
    font-weight:600;
    box-shadow: inset 2px 0 0 var(--pal-mint);
  }
  .navlist button.active svg{ opacity:1; }
  .navlist .navgroup-label{
    font-size:10px; letter-spacing:0.14em; text-transform:uppercase;
    color:#5f7d77; padding:14px 12px 6px 12px; font-weight:600;
  }
  .sidebar-foot{
    padding:14px 22px 18px 22px;
    border-top:1px solid rgba(255,255,255,0.1);
    font-size:11.5px;
    color:#7fa39b;
    display:flex; flex-direction:column; gap:10px;
  }
  .sidebar-foot .month-chip{
    display:inline-flex;align-items:center;gap:6px;
    background:rgba(255,255,255,0.06);
    border:1px solid rgba(255,255,255,0.14);
    padding:5px 10px;border-radius:20px;
    color:#f2fbf8; font-weight:600; font-size:12px;
    width:fit-content;
  }
  .save-status{
    display:flex; align-items:center; gap:7px; font-size:11px; color:#7fa39b;
  }
  .save-status .dot{
    width:6px; height:6px; border-radius:50%; background:var(--pal-mint); flex-shrink:0;
  }
  .save-status.error{ cursor:pointer; }
  .save-status.error .dot{ background:#ff9d9d; }
  .save-status.saving .dot{ background:var(--pal-teal); }

  /* ---------- MAIN ---------- */
  .main{ flex:1; min-width:0; }
  .topbar{
    position:sticky; top:0; z-index:5;
    background:rgba(220,238,234,0.92);
    backdrop-filter:blur(6px);
    border-bottom:1px solid var(--rule);
    padding:20px 36px;
    display:flex; align-items:center; justify-content:space-between; gap:20px;
  }
  .topbar h2{
    font-family:'Inter',serif;
    font-size:24px; font-weight:700; margin:0; color:var(--ink);
  }
  .topbar .sub{ color:var(--slate); font-size:12.5px; margin-top:2px;}
  .content{ padding:28px 36px 60px 36px; max-width:1180px; }

  .month-select{
    display:flex; align-items:center; gap:8px;
    background:var(--card); border:1px solid var(--rule);
    border-radius:20px; padding:6px 6px 6px 14px;
  }
  .month-select label{ font-size:11px; text-transform:uppercase; letter-spacing:0.1em; color:var(--slate-soft); }
  .month-select select{
    border:none; background:none; font-family:'IBM Plex Mono',monospace;
    font-size:13px; font-weight:600; color:var(--ink); padding:4px 6px; cursor:pointer;
  }

  /* ---------- CARDS / COMMON ---------- */
  .card{
    background:var(--card);
    border:1px solid var(--rule-soft);
    border-radius:var(--radius);
    box-shadow:var(--shadow);
  }
  .card-header{
    padding:16px 20px; border-bottom:1px solid var(--rule-soft);
    display:flex; align-items:center; justify-content:space-between; gap:12px;
  }
  .card-header h3{ font-family:'Inter',serif; font-size:16.5px; margin:0; font-weight:700; color:var(--ink);}
  .card-body{ padding:20px; }

  .stat-row{ display:grid; grid-template-columns:repeat(3,1fr); gap:16px; margin-bottom:24px;}
  .section-divider{
    display:flex; align-items:center; gap:12px; margin:8px 0 16px 0;
  }
  .section-divider h3{
    font-family:'Inter',sans-serif; font-size:13px; font-weight:700; text-transform:uppercase;
    letter-spacing:0.08em; color:var(--brass-dark); margin:0; white-space:nowrap;
  }
  .section-divider::after{
    content:""; flex:1; height:1px; background:var(--rule);
  }
  .attendance-compact .card-header h3{ font-size:14px; }
  .attendance-compact input[type=number]{ padding:7px 8px; text-align:center; }
  .attendance-compact .field-label{ font-size:10px; margin-bottom:4px; }
  .stat-card{
    background:var(--card); border:1px solid var(--rule-soft); border-radius:var(--radius);
    padding:18px 20px; box-shadow:var(--shadow); position:relative; overflow:hidden;
  }
  .stat-card::before{
    content:""; position:absolute; left:0; top:0; bottom:0; width:3px; background:var(--brass);
  }
  .stat-card .label{ font-size:10.5px; text-transform:uppercase; letter-spacing:0.12em; color:var(--slate-soft); font-weight:600;}
  .stat-card .value{ font-family:'IBM Plex Mono',monospace; font-size:28px; font-weight:600; color:var(--ink); margin-top:6px;}
  .stat-card .value small{ font-size:14px; color:var(--slate); font-weight:500;}
  .stat-card .delta{ font-size:12px; margin-top:4px; color:var(--slate);}

  table{ width:100%; border-collapse:collapse; font-size:13px;}
  th{
    text-align:left; font-size:10.5px; text-transform:uppercase; letter-spacing:0.08em;
    color:var(--slate-soft); font-weight:700; padding:9px 12px; border-bottom:2px solid var(--rule);
    white-space:nowrap;
  }
  td{ padding:11px 12px; border-bottom:1px solid var(--rule-soft); vertical-align:middle; }
  tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:rgba(169,121,58,0.045); }
  .num{ font-family:'IBM Plex Mono',monospace; }
  .agent-name{ font-style:italic; font-weight:500; color:var(--slate); }
  .row-total td{ font-weight:700; background:var(--paper-deep); border-top:2px solid var(--rule); }

  .badge{
    display:inline-flex; align-items:center; gap:5px; font-family:'IBM Plex Mono',monospace;
    font-weight:600; font-size:12.5px; padding:3px 9px; border-radius:20px;
  }
  .badge.green{ background:var(--green-bg); color:var(--green); }
  .badge.amber{ background:var(--amber-bg); color:var(--amber-dark, var(--amber)); }
  .badge.red{ background:var(--red-bg); color:var(--red); }
  .badge.neutral{ background:var(--paper-deep); color:var(--slate); }

  button.btn{
    font-family:inherit; font-weight:600; font-size:13px; border-radius:var(--radius-sm); cursor:pointer;
    padding:9px 16px; border:1px solid transparent; transition:all 0.12s;
  }
  button.btn.primary{ background:var(--ink); color:#eafaf5; }
  button.btn.primary:hover{ background:var(--ink-2); }
  button.btn.brass{ background:var(--brass); color:#fff; }
  button.btn.brass:hover{ background:var(--brass-dark); }
  button.btn.ghost{ background:transparent; border:1px solid var(--rule); color:var(--ink-text); }
  button.btn.ghost:hover{ border-color:var(--slate-soft); }
  button.btn.danger{ background:transparent; color:var(--red); border:1px solid var(--red-bg); }
  button.btn.danger:hover{ background:var(--red-bg); }
  button.btn.sm{ padding:5px 11px; font-size:12px; }
  button.btn:disabled{ opacity:0.5; cursor:not-allowed; }
  .icon-btn{
    background:none; border:none; cursor:pointer; color:var(--slate); padding:6px; border-radius:var(--radius-sm);
    display:inline-flex; align-items:center; justify-content:center;
  }
  .icon-btn:hover{ background:var(--paper-deep); color:var(--ink); }
  .icon-btn.danger:hover{ background:var(--red-bg); color:var(--red); }

  label.field-label{ display:block; font-size:11.5px; font-weight:600; text-transform:uppercase; letter-spacing:0.06em; color:var(--slate); margin-bottom:6px;}
  input[type=text], input[type=number], input[type=date], select, textarea{
    width:100%; font-family:inherit; font-size:13.5px; color:var(--ink-text);
    background:var(--card); border:1px solid var(--rule); border-radius:var(--radius-sm); padding:9px 11px;
  }
  input:focus, select:focus, textarea:focus{ outline:2px solid var(--brass); outline-offset:1px; border-color:var(--brass); }
  textarea{ resize:vertical; min-height:76px; line-height:1.5; }
  .field{ margin-bottom:16px; }
  .field-grid{ display:grid; grid-template-columns:repeat(2,1fr); gap:16px; }
  .field-hint{ font-size:11.5px; color:var(--slate-soft); margin-top:5px; }

  .crit-card{
    border:1px solid var(--rule-soft); border-left:3px solid var(--rule);
    border-radius:12px; padding:14px 16px; margin-bottom:12px; background:var(--card);
    transition:border-color 0.15s, background 0.15s;
  }
  .crit-card:last-child{ margin-bottom:0; }
  .crit-card[data-band="unscored"]{ border-left-color:var(--rule); }
  .crit-card[data-band="0"]{ border-left-color:var(--red); background:color-mix(in srgb, var(--red-bg) 40%, var(--card)); }
  .crit-card[data-band="1"]{ border-left-color:var(--amber); background:color-mix(in srgb, var(--amber-bg) 40%, var(--card)); }
  .crit-card[data-band="2"]{ border-left-color:var(--green); background:color-mix(in srgb, var(--green-bg) 40%, var(--card)); }
  .crit-head{
    display:flex; align-items:flex-start; justify-content:space-between; gap:16px; flex-wrap:wrap;
  }
  .crit-head .crit-info{ flex:1; min-width:200px; }
  .crit-name{ font-weight:600; color:var(--ink-text); font-size:13.5px; }
  .crit-desc{ font-size:12px; color:var(--slate-soft); margin-top:3px; line-height:1.45; }
  .seg{
    display:flex; border:1px solid var(--rule); border-radius:20px; overflow:hidden; background:var(--card);
    flex-shrink:0;
  }
  .seg button{
    border:none; background:none; padding:8px 14px; font-family:'IBM Plex Mono',monospace;
    font-size:11.5px; font-weight:600; color:var(--slate); cursor:pointer; border-right:1px solid var(--rule);
    white-space:nowrap;
  }
  .seg button:last-child{ border-right:none; }
  .seg button.sel-0.active{ background:var(--red-bg); color:var(--red); }
  .seg button.sel-1.active{ background:var(--amber-bg); color:var(--amber-dark,var(--amber)); }
  .seg button.sel-2.active{ background:var(--green-bg); color:var(--green); }
  .crit-note{ margin-top:10px; }
  .crit-note textarea{
    min-height:52px; font-size:12.5px; padding:8px 10px; background:var(--card);
  }
  .crit-note .note-label{
    font-size:10.5px; text-transform:uppercase; letter-spacing:0.06em; color:var(--slate-soft);
    font-weight:600; margin-bottom:4px; display:flex; align-items:center; gap:6px;
  }
  .crit-note .note-label .req-dot{
    width:5px; height:5px; border-radius:50%; background:var(--rule); display:inline-block;
  }
  .crit-card[data-band="0"] .note-label .req-dot{ background:var(--red); }
  .crit-card[data-band="1"] .note-label .req-dot{ background:var(--amber); }
  .crit-card[data-band="2"] .note-label .req-dot{ background:var(--green); }
  .crit-info-toggle{
    background:none; border:none; cursor:pointer; font-family:inherit; font-size:11px;
    font-weight:600; color:var(--brass); padding:6px 0 0 0; letter-spacing:0.02em;
  }
  .crit-info-toggle:hover{ color:var(--brass-dark); text-decoration:underline; }
  .crit-info-panel{
    display:none; margin-top:8px; background:var(--neutral-bg); border:1px solid var(--rule);
    border-radius:var(--radius-sm); padding:10px 13px; font-size:11.5px; line-height:1.6; color:var(--neutral-ink);
    white-space:pre-line;
  }
  .crit-info-panel.open{ display:block; }
  .prev-reviews{
    background:var(--brass-tint); border:1px solid var(--rule); border-radius:var(--radius);
    padding:14px 18px; margin:18px 0; font-size:13px;
  }
  .prev-reviews .prev-title{
    font-size:11px; text-transform:uppercase; letter-spacing:0.08em; font-weight:700;
    color:var(--brass-dark); margin-bottom:8px;
  }
  .prev-reviews .prev-item{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:6px 0; border-top:1px solid rgba(0,0,0,0.06);
  }
  .prev-reviews .prev-item:first-of-type{ border-top:none; }
  .prev-reviews .prev-item .agent-name{ color:var(--slate); }
  .summary-actions{
    display:flex; align-items:center; justify-content:space-between; gap:14px; flex-wrap:wrap;
    background:var(--paper-deep); border:1px solid var(--rule-soft); border-radius:var(--radius);
    padding:14px 18px; margin-bottom:18px;
  }
  .summary-actions p{ margin:0; font-size:12.5px; color:var(--slate); max-width:520px; }
  .gen-note{ font-size:11.5px; color:var(--slate-soft); margin-top:8px; }

  .total-strip{
    display:flex; align-items:center; justify-content:space-between; gap:16px;
    background:var(--ink); color:#eafaf5; border-radius:12px; padding:16px 22px; margin:20px 0;
  }
  .total-strip .tlabel{ font-size:11px; text-transform:uppercase; letter-spacing:0.12em; color:#9dc3ba;}
  .total-strip .tval{ font-family:'IBM Plex Mono',monospace; font-size:26px; font-weight:700; }
  .total-strip .tval small{ font-size:14px; font-weight:500; color:#a9d3c9;}

  .letterhead{
    border:1px solid var(--rule); border-radius:var(--radius); overflow:hidden; background:var(--card);
  }
  .letterhead .lh-band{
    background:var(--ink); color:#eafaf5; padding:16px 22px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .letterhead .lh-band h4{ margin:0; font-family:'Inter',serif; font-size:16px; font-weight:700;}
  .letterhead .lh-body{ padding:20px 22px; }
  .kv-table{ width:100%; border-collapse:collapse; }
  .kv-table td{ padding:8px 12px; border:1px solid var(--rule); font-size:13px; }
  .kv-table td.k{ background:var(--paper-deep); font-weight:700; width:210px; text-transform:uppercase; font-size:11px; letter-spacing:0.04em; color:var(--slate); }

  .section-block{ margin-top:18px; }
  .section-block h5{
    font-family:'Inter',serif; font-size:14px; margin:0 0 6px 0; color:var(--ink); font-weight:700;
    border-bottom:1.5px solid var(--brass); padding-bottom:5px; display:inline-block;
  }
  .section-block p{ margin:8px 0 0 0; color:var(--ink-text); white-space:pre-wrap; }

  .empty-state{
    text-align:center; padding:56px 20px; color:var(--slate-soft);
  }
  .empty-state svg{ opacity:0.5; margin-bottom:12px; }
  .empty-state h4{ font-family:'Inter',serif; color:var(--ink); font-size:17px; margin:0 0 6px 0; }
  .empty-state p{ font-size:13px; margin:0 0 18px 0; }

  .toast-wrap{ position:fixed; bottom:24px; right:24px; z-index:200; display:flex; flex-direction:column; gap:10px;}
  .toast{
    background:var(--ink); color:#eafaf5; padding:12px 18px; border-radius:10px; font-size:13px;
    box-shadow:0 8px 24px rgba(0,0,0,0.25); display:flex; align-items:center; gap:10px;
    border-left:3px solid var(--brass);
    animation: slidein 0.25s ease-out;
  }
  @keyframes slidein{ from{ opacity:0; transform:translateY(8px);} to{opacity:1; transform:translateY(0);} }

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(20,29,49,0.55); display:flex; align-items:flex-start;
    justify-content:center; padding:40px 20px; z-index:100; overflow-y:auto;
  }
  .modal{
    background:var(--paper); border-radius:5px; width:100%; max-width:680px; box-shadow:0 20px 60px rgba(0,0,0,0.35);
    border:1px solid var(--rule);
  }
  .modal-head{
    padding:18px 24px; border-bottom:1px solid var(--rule); display:flex; align-items:center; justify-content:space-between;
  }
  .modal-head h3{ font-family:'Inter',serif; margin:0; font-size:18px;}
  .modal-body{ padding:22px 24px; max-height:70vh; overflow-y:auto;}
  .modal-foot{ padding:16px 24px; border-top:1px solid var(--rule); display:flex; justify-content:flex-end; gap:10px;}

  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .support-chip{
    display:flex; align-items:center; gap:10px; background:var(--card); border:1px solid var(--rule-soft);
    padding:9px 8px 9px 14px; border-radius:20px; font-size:13px; font-weight:600; box-shadow:var(--shadow);
  }
  .support-chip .initial{
    width:22px;height:22px;border-radius:50%; background:var(--ink); color:#eafaf5; display:flex;
    align-items:center; justify-content:center; font-size:10.5px; font-family:'Inter',serif; font-weight:700;
  }

  .filter-bar{ display:flex; gap:10px; align-items:center; margin-bottom:16px; flex-wrap:wrap;}
  .filter-bar select, .filter-bar input{ width:auto; }

  .count-table th:not(:first-child){ text-align:center; }
  .count-table td.num{ text-align:center; }
  .target-input{
    width:64px !important; text-align:center; padding:6px 4px !important; font-family:'IBM Plex Mono',monospace;
    font-weight:600; display:inline-block;
  }

  .loading-screen{
    position:fixed; inset:0; background:var(--paper); display:flex; align-items:center; justify-content:center;
    flex-direction:column; gap:14px; z-index:999;
  }
  .loading-screen .seal-lg{
    width:52px;height:52px;border-radius:50%; border:2px solid var(--brass); display:flex; align-items:center;
    justify-content:center; font-family:'Inter',serif; font-weight:700; font-size:20px; color:var(--brass);
    animation: pulse 1.4s ease-in-out infinite;
  }
  @keyframes pulse{ 0%,100%{ opacity:1;} 50%{ opacity:0.4;} }
  .loading-screen p{ color:var(--slate); font-size:13px; letter-spacing:0.04em;}

  ::-webkit-scrollbar{ width:9px; height:9px;}
  ::-webkit-scrollbar-thumb{ background:var(--rule); border-radius:6px;}
  ::-webkit-scrollbar-track{ background:transparent;}

  @media (max-width: 880px){
    .app{ flex-direction:column; }
    .sidebar{ width:100%; height:auto; position:relative; flex-direction:row; align-items:center; overflow-x:auto;}
    .brand{ border-bottom:none; padding:14px 16px;}
    nav.navlist{ display:flex; padding:8px; }
    .sidebar-foot{ display:none; }
    .content{ padding:20px 16px 60px; }
    .topbar{ padding:16px; flex-direction:column; align-items:flex-start; gap:10px;}
    .stat-row{ grid-template-columns:1fr; }
    .field-grid{ grid-template-columns:1fr; }
    .crit-head{ flex-direction:column; align-items:stretch; }
    .seg{ width:100%; }
    .seg button{ flex:1; }
  }
</style>
</head>

    details:`Did the agent adhere to data privacy regulations, company policies, and established processes while avoiding behaviors that could compromise compliance or professionalism, such as:
•  Chat avoidance

];
const MAX_SCORE = CRITERIA.reduce((s,c)=>s+c.max,0); // 17

const AUGUST_2026_SEED = [
  { supportName:'Aj Dela Cruz', aliases:[], month:'2026-08', dateOfEval:'2026-08-19', chatDate:'2026-08-07', agentName:'Dean Clemente', caseNumber:'13872622',
    scores:{ identification:1, relationship:1, diagnosis:1, accuracy:1, communication:2, resource:0, logging:2, efficiency:2, compliance:1 },
    criteriaNotes:{ identification:'Subtemplate is not showing, and the incorrect KB was followed. Support had the opportunity to ask the agent for clarification and provide the correct KB: 4487.', relationship:'Support remotely connected to clear the first failure but did not instruct the agent to check the closing dates, amount, and count through PuTTY to ensure everything was correct.', diagnosis:'Support is already familiar with this issue, but there was an opportunity to verify whether the site is closing at the correct time or following the automatic end-of-day process. Support could have also checked the closing dates, amounts, and counts to ensure everything was accurate and properly aligned.', accuracy:'Support was able to apply the fix, but they also needed to check with the network or conference the site to make sure that, going forward, the site follows the correct closing date and time.', communication:'Support was able to communicate properly with the agent.', resource:'The KB was not properly utilized. Support was unable to check the batch configuration to confirm if it was set to Day, verify whether the caller was closing at the correct time, or check the count and amount to ensure they were not exceeding the limit and determine if anything needed to be manually deleted. The process for conferencing the call to the Network team was also not followed.', logging:'All are properly documented.', efficiency:'Support consistently provided answers to the agent.', compliance:'No compliance concerns.' },
    supportAction:`Support was able to communicate properly with the agent and provide the necessary assistance. However, there were opportunities to improve the troubleshooting process. The correct KB (4487) should have been followed, and Support should have verified the batch configuration, closing date and time, amount, and count through PuTTY. Support should also have confirmed whether the site was following the correct automatic end-of-day process. For cases requiring Network involvement, Support should have followed the proper process by conferencing the call to the Network team to ensure the issue was fully addressed and to prevent recurrence.`,
    commitmentObservations:`Going forward, Support will ensure the correct KB and troubleshooting steps are followed. They will verify the site's closing configuration, dates, amounts, and counts, and confirm that the site is following the correct closing process. When Network assistance is required, Support will follow the proper conferencing process.`,
    additionalActions:`The Subtemplate was not displaying, and the incorrect KB was initially followed. Support had an opportunity to clarify the issue with the agent and provide KB 4487. PuTTY should be used to verify the closing date, amount, and count after clearing the initial failure. Batch configuration should be checked to confirm it is set correctly to Day. Support should verify that the site is closing at the correct time and following the automatic end-of-day process. The Network team should be involved when necessary to confirm the site's configuration and closing process.`,
    tlCommitment:`I will coach Support to consistently use the correct KB and Subtemplate, verify all required configurations during troubleshooting, and ensure the complete troubleshooting process is followed before resolving the case. I will also reinforce the proper escalation and conferencing process with the Network team when required.` },

  { supportName:'Aj Dela Cruz', aliases:[], month:'2026-08', dateOfEval:'2026-08-24', chatDate:'2026-08-24', agentName:'Japteg Singh', caseNumber:'13936552',
    scores:{ identification:2, relationship:2, diagnosis:1, accuracy:1, communication:2, resource:1, logging:2, efficiency:2, compliance:1 },
    criteriaNotes:{ identification:'The template listed Contract Type as PSP HD / ASM / No Onsite, and support handled the entire case remotely with no dispatch or VASC referral needed — correct for this contract type. No sub-template issues, and support did not ask anything already answered in the template, since the agent had already provided a thorough troubleshooting summary.', relationship:'The agent came in with a clear, well-documented ask (clear stuck cashiers, logs, and firstFailureDate) backed by thorough pre-troubleshooting, so support moving directly into action rather than asking additional clarifying questions was appropriate here — the groundwork had already been laid. The tone throughout was friendly and professional on both sides.', diagnosis:'Support\'s technical diagnosis and verification (Buypass ID, localtotals thresholds, firstFailureDate, cashier/jlog/tlog checks) was thorough and accurate. However, support did not flag or investigate the inconsistent day-close timestamps visible in the log listing the agent provided (ranging from 3:01 AM to as late as 2:39 PM across different days). This inconsistency is a likely root cause of the recurring StopTransaction trigger, and per KB, sites with irregular or out-of-window closes are at risk of this issue recurring — potentially escalating to a disk-full condition if left unaddressed. Support has an opportunity to review day-close timing patterns like this and advise the agent to confirm the site\'s correct cutoff/batch-close window with the network or get Buypass on a conference call, rather than only resolving the immediate symptom.', accuracy:'The technical fix applied was accurate and resolved the immediate issue. However, without addressing the inconsistent close times, the underlying root cause remains unaddressed, and the same issue is likely to recur. Support has an opportunity to pair the technical fix with a recommendation to correct the site\'s closing schedule, so the fix is not just a repeat patch on a recurring problem.', communication:'Support\'s updates were concise but complete, clearly confirming each check performed and its result, which suits a technical peer-to-peer exchange like this one. Communication was easy to follow throughout.', resource:'Support made good use of the available tools for the technical checks — Buypass ID, localtotals threshold verification, firstFailureDate clearing, and additional standard checks (cashiers, jlogs, tlogs, fuel pending transactions). However, support has an opportunity here: given the site\'s day-close timestamps were inconsistent (ranging from 3:01 AM to 2:39 PM across different days), support should have verified the closing/cutoff timeframe with the network or Buypass directly. This isn\'t an optional extra step — when a site isn\'t closing consistently, confirming the correct close window with the network is necessary to prevent the issue from recurring. Resolving the symptom without this verification leaves the root cause unaddressed.', logging:'No dispatch or transfer was required, and nothing in the transcript indicates improper handling of logging.', efficiency:'Support\'s response times were excellent throughout — connection info to first update in under 3 minutes, additional checks completed shortly after, and the agent confirmed resolution within a reasonable window matching the "check after 2-3 mins" guidance. No agent question went unanswered.', compliance:'No compliance concerns.' },
    supportAction:`Support reviewed the template and correctly handled the case remotely under the PSP HD / ASM / No Onsite contract. Since the agent provided a detailed troubleshooting summary upfront, Support appropriately proceeded directly into the technical checks without repeating questions that had already been answered. Support verified the Buypass ID, localtotals thresholds, firstFailureDate, cashier status, Jlogs, Tlogs, and pending fuel transactions. The required technical fix was applied successfully, and the immediate StopTransaction issue was resolved.`,
    commitmentObservations:`Support demonstrated strong technical troubleshooting and verification. The checks performed were thorough, the communication was concise and easy to follow, and the response times were excellent. The main gap was that Support did not investigate the inconsistent day-close timestamps, which ranged from approximately 3:01 AM to 2:39 PM across different days. This is an important finding because inconsistent or out-of-window day closes can contribute to recurring StopTransaction issues. While the immediate issue was resolved, the underlying cause was not fully addressed, creating a potential risk of recurrence.`,
    additionalActions:`Support should review the site's day-close pattern whenever recurring StopTransaction behavior is identified. Given the inconsistent closing times, Support should recommend confirming the correct cutoff or batch-close window with the network or coordinating with Buypass to verify the expected timeframe. The case should include documentation of the irregular close times and the recommendation provided to the site. Addressing the closing schedule along with the technical fix would provide a more complete resolution and reduce the likelihood of the issue recurring.`,
    tlCommitment:`This was a strong interaction from a technical execution, communication, and responsiveness standpoint. The primary coaching opportunity is to look beyond the immediate symptom and identify potential recurring root causes. Support should review available logs and timestamps for patterns that may explain why the issue is recurring and ensure those findings are addressed before closing the case. The technical fix was correct, but pairing it with verification of the site's day-close/cutoff schedule would result in a more complete and sustainable resolution.` },

  { supportName:'Christian Mark Patdu', aliases:['Christian Patdu'], month:'2026-08', dateOfEval:'2026-08-24', chatDate:'2026-08-24', agentName:'Jerry Perez', caseNumber:'13932253',
    scores:{ identification:2, relationship:2, diagnosis:2, accuracy:1, communication:2, resource:2, logging:1, efficiency:0, compliance:1 },
    criteriaNotes:{ identification:'Support correctly reviewed the template and did not re-ask for information already provided. The contract type was HD/ASM / No ON-SITE, and support\'s later referral to VASC was consistent with this contract, so no correction was needed here.', relationship:'Support guided the agent step-by-step through putting the pinpad into NetLoader mode and had them reboot and clean the touchscreen rather than simply issuing a fix. But support stopped replying at the end of the conversation, leaving the agent\'s final updates.', diagnosis:'Support asked for connection info and applied a reasonable procedural fix (NetLoader mode, patch reapplication). However, once the touchscreen became unresponsive — a strong signal of hardware failure — support continued with generic steps instead of pivoting the diagnosis toward the likely hardware fault.', accuracy:'The NetLoader/KB-based approach was an accurate first step. When the pinpad could not be placed into NetLoader mode despite multiple attempts, referring the site to VASC was the correct next step given the No ON-SITE contract. Support could improve by explicitly confirming this referral with the agent rather than letting the agent state it independently.', communication:'Support communicated the NetLoader steps clearly, using lettered steps tied to the specific KB article, making a multi-step technical process easy to follow.', resource:'KB 000007768 was referenced and used to guide the NetLoader steps.', logging:'Support did not confirm or acknowledge the VASC referral once the agent made it. A brief confirmation would have closed the loop and ensured the dispatch/log was properly validated on record.', efficiency:'Support gave the right guidance upfront, but after the agent worked through the remaining troubleshooting and reported that no NetLoader option appeared, support did not reply again. The agent was left to conclude on their own and close out the call without confirmation from support.', compliance:'No compliance concerns.' },
    supportAction:`Support reviewed the template and utilized the information already provided without unnecessarily requesting the same details. Support guided the agent through the appropriate NetLoader troubleshooting steps using KB 000007768. Support provided clear, step-by-step instructions for placing the pinpad into NetLoader mode, rebooting the device, and reapplying the patch. Support correctly identified VASC referral as the appropriate next step if NetLoader mode could not be accessed, especially given the HD/ASM / No ON-SITE contract. Support initially provided the correct troubleshooting direction and identified the likely escalation path.`,
    commitmentObservations:`Support demonstrated good knowledge of the applicable KB and followed the appropriate troubleshooting process. The NetLoader approach was reasonable as the initial troubleshooting step for the reported pinpad sync issue. Support was effective in providing detailed instructions that the agent could follow. However, when the pinpad became unresponsive and the agent was unable to access NetLoader mode after multiple attempts, Support did not sufficiently adjust the troubleshooting approach. The biggest gap was lack of follow-through. Support stopped responding after the agent provided the final troubleshooting results. The agent ultimately concluded that the pinpad likely had a hardware issue and proceeded with the VASC referral without receiving confirmation from Support. Support should have acknowledged the final findings and explicitly confirmed whether VASC referral was the correct next step.`,
    additionalActions:`Once multiple attempts to access NetLoader mode failed, Support should have recognized this as a potential hardware-related issue and pivoted from generic troubleshooting. Confirm whether the touchscreen was still responsive and document the behavior as part of the hardware assessment. Review the troubleshooting results and clearly communicate that the software/NetLoader steps were exhausted. Explicitly confirm the VASC referral before the case is closed. Provide a clear closing statement to the agent, such as: "Since the pinpad cannot enter NetLoader mode after following the KB steps, please proceed with the VASC referral for further hardware assessment." Ensure the final action and reason for referral are documented in the case notes.`,
    tlCommitment:`Reinforce the importance of closing the loop with the agent after troubleshooting is completed. Coach Support to recognize when repeated troubleshooting attempts are no longer productive and when the symptoms indicate a likely hardware issue. Remind Support that providing the correct initial troubleshooting is only part of the process; they must also acknowledge the final results and confirm the appropriate next step. Encourage Support to remain engaged until the case has a clear resolution, escalation, or referral path. For future cases, Support should explicitly confirm VASC referrals when the contract type and troubleshooting results support that action. Overall, the troubleshooting guidance was appropriate, but follow-through and final case confirmation need improvement.` },

  { supportName:'Christian Mark Patdu', aliases:['Christian Patdu'], month:'2026-08', dateOfEval:'2026-08-24', chatDate:'2026-08-21', agentName:'Remond Licayan', caseNumber:'13930263',
    scores:{ identification:2, relationship:2, diagnosis:1, accuracy:2, communication:2, resource:2, logging:2, efficiency:2, compliance:1 },
    criteriaNotes:{ identification:'Support did not re-ask for information already provided in the template (Service ID, hardware, contract type, KB reference, troubleshooting already performed). The contract type was correctly acknowledged, and the case was resolved remotely without needing a site visit.', relationship:'Support allowed the agent to independently work through the connectivity troubleshooting (testing ports via openssl, adding routes) and only stepped in at key decision points. Support remained present with acknowledgments like "standing by" and "thanks for the info," and closed the call warmly with "thank you!"', diagnosis:'The root cause (old owner\'s email still tied to the service ID, blocking onboarding of the new commander) was clearly understood from the start. Support confirmed the deletion action with a verifiable system response (status code 200) rather than just assuming success. Support\'s direct diagnostic input was somewhat limited, as most of the technical investigation was carried out by the agent independently.', accuracy:'The solution path was accurate: delete old email/site, confirm deletion via system response, direct the agent to log out/in and re-attempt onboarding. The case reached a fully successful resolution.', communication:'Support communicated clearly and confirmed actions with concrete system output (the JSON deletion response) rather than vague assurances, which gave the agent confidence the step was actually completed.', resource:'Support used the backend system to execute and verify the site deletion, which validated the diagnosis before instructing the agent to proceed with onboarding. The agent independently applied KB 000007872 for the serial number move.', logging:'Support did not need to transfer the chat, and the resolution was confirmed and documented by the agent at the end.', efficiency:'Support was responsive at each key point in the conversation and stood by during the longer independent troubleshooting stretch without leaving the agent without direction. Support closed out the interaction properly with a thank-you.', compliance:'No compliance concerns.' },
    supportAction:`Support reviewed the provided template and utilized the information already available without unnecessarily re-asking for details. Support correctly acknowledged the ASM/PSP HD/No ON-SITE contract type and determined that no dispatch was required. Support identified the primary issue as the old owner's email still being associated with the Service ID, which was preventing the new Commander from onboarding. Support performed the required backend site deletion and verified the action through the successful status code 200 response. The agent then logged out/in and retried the onboarding process, completed the serial number move using KB 000007872, and successfully onboarded the site.`,
    commitmentObservations:`Support demonstrated good case ownership and remained engaged throughout the interaction. The troubleshooting path was accurate and resulted in a fully resolved case. Support appropriately validated the backend deletion rather than assuming the action was successful. Communication was professional and approachable, with Support acknowledging the agent's updates and remaining available while the agent performed the connectivity troubleshooting. Support also avoided an unnecessary transfer and allowed the agent to complete the required troubleshooting. One area for improvement is that Support's direct technical guidance during the connectivity investigation was limited, as the agent independently performed the OpenSSL port checks and route additions while Support primarily acknowledged and confirmed the steps.`,
    additionalActions:`Support could provide more proactive guidance during connectivity troubleshooting instead of primarily waiting for the agent to perform the diagnostic steps. When the agent performs port testing or adds routes, Support should explain the purpose of each step and what results should be expected. Support should continue validating backend actions with concrete system responses, such as the status code 200, and maintain the same level of responsiveness throughout the case. The final resolution should also clearly document the old email deletion, serial number move, and successful onboarding.`,
    tlCommitment:`The interaction demonstrated strong case ownership, responsiveness, and proper case closure. The coaching focus should be on becoming more proactive during the technical troubleshooting portion by guiding the agent through each diagnostic step and explaining the expected results. Support should continue reviewing the template before troubleshooting, avoiding unnecessary repetition, validating actions with system responses, and remaining engaged until the agent confirms resolution. Overall, this was a successful interaction with the primary coaching opportunity being stronger technical guidance during diagnostics.` },

  { supportName:'Gemmalyn Silvestre', aliases:['Gemmalyn Pamat'], month:'2026-08', dateOfEval:'2026-08-24', chatDate:'2026-08-21', agentName:'Sidrick Mondalo', caseNumber:'13930992',
    scores:{ identification:2, relationship:2, diagnosis:1, accuracy:1, communication:2, resource:2, logging:2, efficiency:2, compliance:1 },
    criteriaNotes:{ identification:'The template listed Contract Type as ASM / PSP HD / No On-Site, and support handled the case entirely through remote guidance.', relationship:'Support asked good, targeted questions early on ("check batch close period if its set to day," "is there a prev case that they check the cutoff time with buypass?") which guided the agent through the diagnostic process rather than jumping straight to a fix. Support also proactively followed up after the immediate issue was resolved to confirm the underlying cause with the agent, which shows genuine engagement with getting to the root of the problem rather than just closing the ticket once cards started working again. No issues found in this section.', diagnosis:'Support correctly identified this as a classic StopTransaction/firstFailureDate issue, matching KB 000004487 ("Buypass Unable To Process Cards After Day Close") closely — confirmed via EPSConfig.properties, batch close period setting, and AEOD configuration. After the immediate fix, support went a step further and proactively checked the site\'s actual day-close timestamps over several days, uncovering that the site had been closing outside Buypass\'s cutoff window every day from Aug 17–21. That said, support has an opportunity on two KB points: the KB requires checking the previous 3 months of case history for a pattern of repeated StopTransaction fixes and escalating to T3/SME if a pattern exists — there\'s no indication this was done. The agent had also already reported localtotals.xml values exceeding the KB\'s thresholds, and per KB the file itself must be edited down as part of the fix — there\'s no evidence this step was performed.', accuracy:'The fix support applied (clearing firstFailureDate, setting stopTransactions=false) is accurate per KB and resolved the immediate symptom — the agent confirmed cards were processing again after testing. However, since the localtotals.xml values were left uncorrected despite exceeding thresholds, the fix may be incomplete relative to the full KB procedure.', communication:'Support communicated clearly and directly throughout, including a clear explanation after the call about why the site needs to close within Buypass\'s cutoff timeframe. This was one of the stronger points of the interaction.', resource:'Support made good use of available tools and data — reviewing EPSConfig.properties, batch close configuration, AEOD settings, and later pulling day-close file timestamps to independently verify cutoff-time compliance. Support has an opportunity to also act on the two KB-specified checks noted in Diagnosis above.', logging:'No major issues, but support has a minor opportunity to ensure this documentation step is completed given the KB\'s emphasis on tracking repeat occurrences.', efficiency:'Response times throughout the case were reasonable, including during the "wait 2 mins then check" instruction, which the agent followed and reported back on within a reasonable window. No agent request for an update went unanswered.', compliance:'No compliance concerns.' },
    supportAction:`Support handled the case remotely and correctly recognized the issue as a StopTransaction/firstFailureDate problem. Support asked targeted diagnostic questions regarding the batch close period and Buypass cutoff time, then reviewed EPSConfig.properties, batch close settings, and AEOD configuration. Support applied the immediate fix by clearing firstFailureDate and setting stopTransactions=false, after which the agent confirmed that card transactions were working again. Support also went beyond the immediate fix by reviewing the site's day-close timestamps from August 17–21 and confirmed that the site had been closing outside the Buypass cutoff window.`,
    commitmentObservations:`Support demonstrated strong troubleshooting and root-cause analysis by identifying the immediate issue and then investigating why the condition continued to occur. The communication was clear, direct, and collaborative, and Support remained engaged throughout the troubleshooting. The main opportunity is to ensure that all KB-required steps are completed. The KB requires reviewing the previous three months of case history for repeated StopTransaction fixes and escalating/notating the case if a recurring pattern is identified. There was no indication that this historical review was completed. Additionally, the reported localtotals.xml values were above the KB thresholds, but there was no indication that the required localtotals.xml correction was performed. This means the immediate issue was resolved, but the full KB procedure may not have been completed.`,
    additionalActions:`Support should review the previous three months of case history to determine whether the site has experienced repeated StopTransaction fixes and document or escalate the pattern to T3/SME when applicable. Support should also review and correct the localtotals.xml values when they exceed the thresholds specified in the KB. Completing these steps would provide a more comprehensive resolution and help prevent recurrence or potential disk-full issues. The site's day-close timestamps should continue to be reviewed and communicated to the site so they understand the importance of closing within the Buypass cutoff window.`,

  { supportName:'Gemmalyn Silvestre', aliases:['Gemmalyn Pamat'], month:'2026-08', dateOfEval:'2026-08-24', chatDate:'2026-08-21', agentName:'James Querubin', caseNumber:'13930960',

eps accurately. This reflects strong resource utilization for the actual fix itself.', logging:'No dispatch or transfer was required for this case, and there\'s nothing in the transcript indicating improper handling of logging.', efficiency:'This is the main area of concern for this call. There were two extended gaps where the agent was left without a response — one after a direct question at 1217s with no visible answer, and roughly an 11-minute gap between 1851s and 2503s with no update after the agent supplied connection details. Support did own the delay when it re-engaged, which is a positive.', compliance:'No compliance concerns.' },

 of the check. One note: after the agent stated "still rebooting" at 889s, support did not follow up until 1254s (~6 minutes later), though no direct question went unanswered during that gap.', compliance:'No compliance concerns.' },

  { supportName:'Glory Barbacena', aliases:[], month:'2026-08', dateOfEval:'2026-08-24', chatDate:'2026-08-24', agentName:'James Querubin', caseNumber:'13934608',

rt\'s response times were generally reasonable throughout the exchange, including during the KB double-check period (~98 seconds). No agent request for an update went unanswered, though the overall handling time was extended due to the initial inaccurate answer requiring correction.', compliance:'No compliance concerns.' },

    commitmentObservations:`The main observation is that Support provided a compatibility answer too quickly without first verifying the site's Base version and the applicable hardware requirements. The initial "yes" response was inaccurate and could have resulted in incorrect information being provided to the site if the agent had not challenged it. The agent identified the Base 55.02+ requirement, after which Support rechecked the information, acknowledged the mistake, and provided the correct answer. It was positive that Support took accountability and corrected the information rather than continuing with the initial response.`,
    additionalActions:`Support should verify the Base version and compatibility requirements before confirming hardware support, particularly when the answer depends on software version. When referencing a KB, Support should review the relevant sections carefully and identify the specific requirement being used to make the determination. If additional information is needed, Support should ask the clarifying question first rather than providing an immediate yes/no answer. Support should also avoid wording that may sound like they are challenging the agent's information and instead verify the information collaboratively.`,

  { supportName:'Kristian Ong', aliases:[], month:'2026-08', dateOfEval:'2026-08-27', chatDate:'2026-08-27', agentName:'Jerrold Ramirez', caseNumber:'13587296',

 gave the agent a clear script/purpose for the Sunoco call ("explain that we receive a volume of calls that processing slow from sunoco site," get the processor rep\'s name to escalate to their higher support), which set the agent up to have a focused, useful conversation with the processor.', resource:'Support leveraged information from other ongoing cases/agents (the "known nw issue" reported elsewhere) as a resource to inform diagnosis, which is a valid and effective use of internal case knowledge, though no specific KB article (4013) was referenced directly by support during troubleshooting.', logging:'No dispatch was needed as the issue was resolved remotely via commander reboot. The resolution was confirmed by the agent before ending the call, so the outcome is clear, though there\'s no explicit note showing this was tied back to the "known network issue" case/ticket for tracking purposes.', efficiency:'Support responded promptly throughout, including during the gap when the agent was on hold with Sunoco and after the disconnect/redial ("go ahead"). There\'s a ~15-minute gap (1391s "go ahead" to 2300s "now working") where support did not check in once, despite having proactively checked in earlier ("let me know what happen," "how is it going"). Given the agent had just lost connection with Sunoco and was mid-troubleshooting, this is a similar pattern to the responsiveness gap flagged in the first case — support should have followed up given the length of silence, not just waited passively.', compliance:'No compliance concerns noted, though this criterion was marked as not met on the original scoresheet — worth confirming with the reviewer.' },
    supportAction:`Support demonstrated good diagnostic reasoning by reviewing information from other agents and identifying a possible known network issue. They appropriately avoided repeating information already provided in the template and moved directly into next-step troubleshooting. Support guided the agent to contact Sunoco, gather the processor representative's information, and then perform a Commander reboot. The reboot successfully resolved the slow payment processing issue, and no dispatch was required.`,
    commitmentObservations:`Support showed strong ownership and remained engaged and encouraging throughout the troubleshooting process. They provided clear direction, stayed patient when the agent lost connection with Sunoco, and confirmed the issue was resolved before ending the interaction. Support also appropriately used information from other active cases to support the diagnosis. However, there was a significant gap of approximately 15 minutes without a follow-up after instructing the agent to proceed. Since the agent had already experienced a disconnect with Sunoco and was still troubleshooting, Support should have checked in periodically rather than waiting for the agent to return. Additionally, once the possible known network issue was identified, Support should have confirmed whether the case needed to be linked or logged against the broader issue for tracking.`,
    additionalActions:`Follow up with the agent during extended periods of silence, especially when the agent is actively troubleshooting or waiting on another party. Confirm whether the identified "known network issue" has an existing case, incident, or known issue record. Link or document the case against the known network issue when applicable. Reference KB 4013 directly when relevant to provide a documented troubleshooting path. Document that the Commander reboot resolved the issue while noting the possible network-related pattern for future recurrence.`,
    tlCommitment:`Coach Support to maintain proactive communication throughout the entire troubleshooting process, particularly when there are extended periods without updates. A simple check-in such as "Any update?" or "How is it going?" can help ensure the agent does not feel left on their own. Also reinforce the importance of closing the loop when Support identifies a potential broader issue. If multiple agents are reporting the same network behavior, Support should verify the known issue, reference the appropriate KB or ticket, and ensure the case is properly linked for tracking. This will improve case documentation, help identify recurring issues, and prevent temporary resolutions from being mistaken for permanent fixes.` },

function fmtDate(iso){ if(!iso) return '—'; const d=new Date(iso+'T00:00:00'); if(isNaN(d)) return iso; return d.toLocaleDateString('en-US',{month:'short',day:'2-digit',year:'numeric'}); }

function mergeArraysById(a, b){

  [...(a||[]), ...(b||[])].forEach(item=>{ if(item && item.id) map.set(item.id, item); });
  return Array.from(map.values());
}
function mergeMaxCounts(a, b){

  Object.keys(b||{}).forEach(k=>{ out[k] = Math.max(out[k]||0, b[k]); });
  return out;
}
function mergeStates(local, remote){

  const merged = {
    supports: mergeArraysById(remote.supports, local.supports),
    targets: { ...(remote.targets||{}), ...(local.targets||{}) },
    records: mergeArraysById(remote.records, local.records).filter(r=>!deletedRecordIds.includes(r.id)),
    seededAugust2026: !!(local.seededAugust2026 || remote.seededAugust2026),
    deletedCaseNumbers,

    agentReviews: mergeArraysById(remote.agentReviews, local.agentReviews).filter(a=>!deletedAgentReviewIds.includes(a.id)),
    deletedAgentReviewIds,
    viewerSupportId: local.viewerSupportId,
    personalTargets: { ...(remote.personalTargets||{}), ...(local.personalTargets||{}) },
    attendance: { ...(remote.attendance||{}), ...(local.attendance||{}) },
    agentReviewDeletionCounts: mergeMaxCounts(remote.agentReviewDeletionCounts, local.agentReviewDeletionCounts),
    agentReviewAugust2026Seeded: !!(local.agentReviewAugust2026Seeded || remote.agentReviewAugust2026Seeded),
    historicalDuplicatesCleaned: !!(local.historicalDuplicatesCleaned || remote.historicalDuplicatesCleaned),
  };
  return reconcileState(merged);
}
function dedupeSupports(state){
  const groups = new Map();
  (state.supports||[]).forEach(s=>{
    const key = (s.name||'').trim().toLowerCase();
    if(!key) return;
    if(!groups.has(key)) groups.set(key, []);
    groups.get(key).push(s);
  });
  const remap = {};
  const cleaned = [];
  groups.forEach(list=>{
    if(list.length === 1){ cleaned.push(list[0]); return; }
    const scored = list.map(s=>({
      s,
      score: (state.records||[]).filter(r=>r.supportId===s.id).length + (state.agentReviews||[]).filter(a=>a.supportId===s.id).length
    })).sort((a,b)=>b.score-a.score);
    const canonical = scored[0].s;
    cleaned.push(canonical);
    list.forEach(s=>{ if(s.id!==canonical.id) remap[s.id] = canonical.id; });
  });
  if(Object.keys(remap).length === 0) return state;
  const remapId = id => remap[id] || id;
  state.supports = cleaned;
  (state.records||[]).forEach(r=>{ r.supportId = remapId(r.supportId); });
  (state.agentReviews||[]).forEach(a=>{ a.supportId = remapId(a.supportId); });
  ['personalTargets','attendance'].forEach(field=>{
    const out = {};
    Object.entries(state[field]||{}).forEach(([key,val])=>{
      const idx = key.indexOf(':');
      const sid = idx===-1 ? key : key.slice(0,idx);
      const rest = idx===-1 ? '' : key.slice(idx);
      const newKey = remapId(sid) + rest;
      if(!(newKey in out)) out[newKey] = val;
    });
    state[field] = out;
  });
  const remappedCounts = {};
  Object.entries(state.agentReviewDeletionCounts||{}).forEach(([sid,val])=>{
    const nid = remapId(sid);
    remappedCounts[nid] = Math.max(remappedCounts[nid]||0, val);
  });
  state.agentReviewDeletionCounts = remappedCounts;
  if(state.viewerSupportId) state.viewerSupportId = remapId(state.viewerSupportId);
  return state;
}
function completenessScore(obj, fields){
  return fields.reduce((s,f)=> s + (obj[f] ? String(obj[f]).trim().length : 0), 0);
}
function dedupeByKey(list, keyFn, fields){
  const groups = new Map();
  const noKey = [];
  (list||[]).forEach(item=>{
    const k = keyFn(item);
    if(k===null || k===undefined || k===''){ noKey.push(item); return; }
    if(!groups.has(k)) groups.set(k, []);
    groups.get(k).push(item);
  });
  const result = [...noKey];
  groups.forEach(g=>{
    if(g.length === 1){ result.push(g[0]); return; }
    g.sort((a,b)=> completenessScore(b,fields)-completenessScore(a,fields) || (b.createdAt||0)-(a.createdAt||0));
    result.push(g[0]);
  });
  return result;
}
function reconcileState(state){
  state = dedupeSupports(state);
  if(!state.historicalDuplicatesCleaned){
    state.records = dedupeByKey(state.records, r=>String(r.caseNumber||'').trim(), ['supportAction','commitmentObservations','additionalActions','tlCommitment']);
    state.agentReviews = dedupeByKey(state.agentReviews, a=> a.caseNumber ? `${a.mode}:${String(a.caseNumber).trim()}` : null, ['agentName','category','section1']);
    state.historicalDuplicatesCleaned = true;
  }
  return state;
}

  try{ raw = localStorage.getItem(STORAGE_KEY); }catch(e){
    loadFailed = true;
    lastLoadError = { type:'fetch', message: e && e.message ? e.message : String(e) };
    return false;
  }
  if(raw){
    lastRawValue = raw;
    try{
      const parsed = JSON.parse(raw);
      STATE.supports = parsed.supports || [];
      STATE.targets = parsed.targets || {};
      STATE.records = parsed.records || [];
      STATE.seededAugust2026 = !!parsed.seededAugust2026;
      STATE.deletedCaseNumbers = parsed.deletedCaseNumbers || [];
      STATE.deletedRecordIds = parsed.deletedRecordIds || [];
      STATE.augustAccuracyApplied = !!parsed.augustAccuracyApplied;

      STATE.personalTargets = parsed.personalTargets || {};

      STATE.historicalDuplicatesCleaned = !!parsed.historicalDuplicatesCleaned;
      STATE.deletedAgentReviewIds = parsed.deletedAgentReviewIds || [];
      STATE = reconcileState(STATE);
      if(SYNC_URL){
        const remote = await pullRemoteState();
        if(remote !== undefined && !Number.isNaN(remote)){
          STATE = mergeStates(STATE, remote);
          try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); }catch(e){}
        }
      }
      setSaveStatus(null, 'All changes saved');
      return true;
    }catch(e){
      console.error('Parse error', e);
      loadFailed = true;
      lastLoadError = { type:'parse', message: e && e.message ? e.message : String(e) };
      return false;
    }
  } else {
    if(SYNC_URL){
      const remote = await pullRemoteState();
      if(remote && typeof remote === 'object' && Array.isArray(remote.supports) && remote.supports.length){
        STATE = {
          supports: remote.supports || [],
          targets: remote.targets || {},
          records: remote.records || [],
          seededAugust2026: !!remote.seededAugust2026,
          deletedCaseNumbers: remote.deletedCaseNumbers || [],
          deletedRecordIds: remote.deletedRecordIds || [],
          augustAccuracyApplied: !!remote.augustAccuracyApplied,
          agentReviews: remote.agentReviews || [],
          viewerSupportId: null,
          personalTargets: remote.personalTargets || {},
          attendance: remote.attendance || {},
          agentReviewDeletionCounts: remote.agentReviewDeletionCounts || {},
          agentReviewAugust2026Seeded: !!remote.agentReviewAugust2026Seeded,
          historicalDuplicatesCleaned: !!remote.historicalDuplicatesCleaned,
          deletedAgentReviewIds: remote.deletedAgentReviewIds || []
        };
        STATE = reconcileState(STATE);
        try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); }catch(e){}
        setSaveStatus(null, 'All changes saved');
        return true;
      }
    }
    STATE = seedState();
    await saveState();
    return true;
  }
}

let hasUnsavedFailure = false;

async function saveState(){
  setSaveStatus('saving', 'Saving…');
  try{
    if(!isStorageReady()) throw new Error('localStorage is blocked or unavailable in this browser.');
    localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
    hasUnsavedFailure = false;
    let syncFailed = false;
    if(SYNC_URL){
      const remote = await pullRemoteState();
      if(remote !== undefined && !Number.isNaN(remote)){
        STATE = mergeStates(STATE, remote);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
      } else if(Number.isNaN(remote)){
        syncFailed = true;
      }
      const pushOk = await pushRemoteState(STATE);
      if(!pushOk) syncFailed = true;
    }
    const stamp = new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
    if(SYNC_URL && syncFailed){
      setSaveStatus('error', 'Saved on this device — sync failed, tap to retry');
      toastRetry('Saved here, but couldn\u2019t reach the shared database. Tap to retry syncing.');
    } else {
      setSaveStatus(null, SYNC_URL ? `Synced at ${stamp}` : `Saved at ${stamp}`);
    }
    return true;
  }catch(e){
    console.error('Storage error', e);
    hasUnsavedFailure = true;
    setSaveStatus('error', 'Not saved — tap to retry');
    toastRetry('Could not save your last change. Tap here to try again.');
    return false;
  }
}
window.addEventListener('beforeunload', (e)=>{
  if(hasUnsavedFailure){
    e.preventDefault();
    e.returnValue = '';
    return '';
  }
});

function findOrCreateSupport(canonicalName, aliases){
  let sup = STATE.supports.find(s=>s.name.toLowerCase()===canonicalName.toLowerCase());
  if(!sup){
    for(const alias of (aliases||[])){
      sup = STATE.supports.find(s=>s.name.toLowerCase()===alias.toLowerCase());
      if(sup){ sup.name = canonicalName; break; }
    }
  }
  if(!sup){ sup = { id: uid('sup'), name: canonicalName }; STATE.supports.push(sup); }
  return sup;
}
async function ensureAugustSeed(){
  if(STATE.seededAugust2026) return;
  const existingCases = new Set(STATE.records.map(r=>String(r.caseNumber)));
  const deletedCases = new Set((STATE.deletedCaseNumbers||[]).map(String));
  AUGUST_2026_SEED.forEach(entry=>{
    if(existingCases.has(String(entry.caseNumber))) return;
    if(deletedCases.has(String(entry.caseNumber))) return;
    const sup = findOrCreateSupport(entry.supportName, entry.aliases);
    const total = Object.values(entry.scores).reduce((s,v)=>s+v,0);
    STATE.records.push({
      id: uid('rec'),
      month: entry.month,
      supportId: sup.id,
      supportName: sup.name,
      dateOfEval: entry.dateOfEval,
      chatDate: entry.chatDate,
      agentName: entry.agentName,
      caseNumber: entry.caseNumber,
      scores: entry.scores,
      criteriaNotes: entry.criteriaNotes || {},
      total,
      percent: total / MAX_SCORE,
      supportAction: entry.supportAction,
      commitmentObservations: entry.commitmentObservations,
      additionalActions: entry.additionalActions,
      tlCommitment: entry.tlCommitment,
      createdAt: Date.now(),
      updatedAt: Date.now()
    });
  });
  STATE.seededAugust2026 = true;
  await saveState();
}
async function ensureAugustNotes(){
  let changed = false;
  AUGUST_2026_SEED.forEach(entry=>{
    if(!entry.criteriaNotes) return;
    const rec = STATE.records.find(r=>String(r.caseNumber)===String(entry.caseNumber));
    if(!rec) return;
    const hasNotes = rec.criteriaNotes && Object.values(rec.criteriaNotes).some(v=>v && v.trim());
    if(!hasNotes){
      rec.criteriaNotes = { ...entry.criteriaNotes };
      changed = true;
    }
  });
  if(changed) await saveState();
}
async function ensureAugustAccuracy(){
  if(STATE.augustAccuracyApplied) return;
  AUGUST_2026_SEED.forEach(entry=>{
    const rec = STATE.records.find(r=>String(r.caseNumber)===String(entry.caseNumber));
    if(!rec) return;
    rec.scores = { ...entry.scores };

    rec.total = Object.values(entry.scores).reduce((s,v)=>s+v,0);

/* ---------------------- DERIVED HELPERS ---------------------- */
function allMonthsUsed(){
  const set = new Set(STATE.records.map(r=>r.month));
  set.add(currentMonth);
  const now = new Date();
  set.add(monthKey(now));
  return Array.from(set).sort();
}
function recordsFor(month, supportId){
  return STATE.records.filter(r=>r.month===month && (!supportId || r.supportId===supportId))
    .sort((a,b)=> (a.createdAt||0)-(b.createdAt||0));
}
function avgPercent(recs){
  if(!recs.length) return null;
  return recs.reduce((s,r)=>s+r.percent,0)/recs.length;
}
function sortedSupports(){
  return [...STATE.supports].sort((a,b)=>a.name.localeCompare(b.name, undefined, {sensitivity:'base'}));
}
function getTarget(month){
  if(STATE.targets[month] !== undefined) return STATE.targets[month];
  return 16;
}
function personalTargetKey(supportId, month){ return `${supportId}:${month}`; }
function getPersonalTarget(supportId, month){
  const key = personalTargetKey(supportId, month);
  if(STATE.personalTargets[key] !== undefined && STATE.personalTargets[key] !== null && STATE.personalTargets[key] !== '') return Number(STATE.personalTargets[key]);
  return null;
}
function getAttendance(supportId, month){
  const key = personalTargetKey(supportId, month);
  return STATE.attendance[key] || { absent:0, vl:0, ml:0, el:0 };
}
function getWorkingDaysInMonth(month){
  const [y,m] = month.split('-').map(Number);
  const daysInMonth = new Date(y, m, 0).getDate();
  let count = 0;
  for(let d=1; d<=daysInMonth; d++){
    const day = new Date(y, m-1, d).getDay();
    if(day !== 0 && day !== 6) count++;
  }
  return count;
}
function getAdjustedTarget(supportId, month){
  const base = getPersonalTarget(supportId, month);
  if(base===null) return null;
  const att = getAttendance(supportId, month);
  const leaveDays = (Number(att.absent)||0) + (Number(att.vl)||0) + (Number(att.ml)||0) + (Number(att.el)||0);
  const workingDays = getWorkingDaysInMonth(month);
  if(leaveDays<=0 || workingDays<=0) return base;
  const factor = Math.max(0, (workingDays - leaveDays) / workingDays);
  return Math.max(0, Math.round(base * factor));
}
function scoreBadgeClass(pct){
  if(pct===null || pct===undefined) return 'neutral';
  if(pct>=0.85) return 'green';
  if(pct>=0.70) return 'amber';
  return 'red';
}
function pctStr(p){ return p===null||p===undefined ? '—' : Math.round(p*100)+'%'; }
function notePlaceholder(c, val){
  if(val===0) return `What was missed or done incorrectly for ${c.name.toLowerCase()}?`;
  if(val===1) return `What was partially done, and what's still missing?`;
  if(val===c.max) return `What did support do well here?`;
  return `Score this criterion first, then explain why.`;
}
function buildSummary(scores, notes){
  const notMet=[], partial=[], met=[];
  CRITERIA.forEach(c=>{
    const val = scores[c.key];
    const note = (notes[c.key]||'').trim();
    const entry = { name:c.name, note, val };
    if(val===0) notMet.push(entry);
    else if(val===c.max) met.push(entry);
    else partial.push(entry);
  });
  const gaps = [...notMet, ...partial];
  const lower = s=>s.charAt(0).toLowerCase()+s.slice(1);
  const list = arr => arr.length<=1 ? (arr[0]||'') : arr.slice(0,-1).join(', ')+' and '+arr[arr.length-1];
  const pick = arr => arr[Math.floor(Math.random()*arr.length)];

  if(!met.length && !gaps.length){
    return { supportAction:'Score each criterion above, then generate the summary.', commitment:'', additional:'', tlNotes:'' };
  }

  const saParts = [];
  if(met.length){
    saParts.push(pick([
      `Support ${gaps.length?'demonstrated good':'demonstrated strong'} reasoning by handling ${list(met.map(m=>lower(m.name)))} well on this case.`,
      `Support showed solid, confident work in ${list(met.map(m=>lower(m.name)))} throughout this interaction.`,
      `This case highlighted real strength in ${list(met.map(m=>lower(m.name)))}.`,
      `Support brought good instincts to ${list(met.map(m=>lower(m.name)))} here.`,
    ]));
    met.filter(m=>m.note).forEach(m=>saParts.push(m.note));
  }
  if(gaps.length){
    saParts.push(pick([
      met.length ? `${pick(['That said','On the other hand','Alongside that'])}, there ${gaps.length>1?'were':'was'} a few spots to build on around ${list(gaps.map(g=>lower(g.name)))}.`
                 : `There ${gaps.length>1?'were':'was'} a few spots to build on around ${list(gaps.map(g=>lower(g.name)))}.`,
      met.length ? `The main opportunity here is around ${list(gaps.map(g=>lower(g.name)))}.`
                 : `The main opportunity in this case is around ${list(gaps.map(g=>lower(g.name)))}.`,
    ]));
    gaps.forEach(g=>{ if(g.note) saParts.push(g.note); });
  }
  const supportAction = saParts.join(' ');

  const cParts = [];
  if(met.length){
    cParts.push(pick([
      `Support showed good ownership here, staying engaged and handling ${list(met.map(m=>lower(m.name)))} the right way.`,
      `There was strong follow-through in this case, particularly in ${list(met.map(m=>lower(m.name)))}.`,
      `Support stayed on top of ${list(met.map(m=>lower(m.name)))}, which reflects well on how this case was handled.`,
    ]));
  }
  if(gaps.length){
    let p2 = pick([
      `However, there was an opportunity to strengthen ${list(gaps.map(g=>lower(g.name)))}.`,
      `That said, ${list(gaps.map(g=>lower(g.name)))} is worth a closer look going forward.`,
      `Looking ahead, ${list(gaps.map(g=>lower(g.name)))} is where the next bit of growth can happen.`,
    ]);
    const notedGaps = gaps.filter(g=>g.note).map(g=>g.note);
    if(notedGaps.length) p2 += ' ' + notedGaps.join(' ');
    p2 += ' ' + pick([
      `This is a good chance to build a stronger habit here for next time.`,
      `Keeping an eye on this on the next few cases should help it stick.`,
      `Nothing dramatic \u2014 just something worth being a little more deliberate about going forward.`,
    ]);
    cParts.push(p2);
  } else {
    cParts.push(`Nothing else to flag here \u2014 the goal now is just to keep this same level of consistency going.`);
  }
  const commitment = cParts.join('\n\n');

  let additional;
  if(!gaps.length){
    additional = pick([
      'Nothing extra needed here \u2014 everything in this case was handled the right way.',
      'No additional actions to flag. This is a good one to hold up as an example.',
    ]);
  } else {
    additional = gaps.map(g=>{
      const base = g.note ? g.note : `Take a closer look at ${lower(g.name)} on the next similar case.`;
      return `* ${base}`;
    }).join('\n\n');
  }

  const tParts = [];
  if(gaps.length){
    tParts.push(pick([
      `I'll walk through ${list(gaps.map(g=>lower(g.name)))} with support directly, using this case as a real, concrete example rather than a hypothetical.`,
      `I'll sit down with support and go over ${list(gaps.map(g=>lower(g.name)))} together, so the expectation is clear for next time.`,
      `I'll take a few minutes with support to talk through ${list(gaps.map(g=>lower(g.name)))}, framing it as a growth area rather than a miss.`,
    ]));
    tParts.push(pick([
      `We'll go over what good looks like here, and I'll check in on the next couple of cases to see how it's landing.`,
      `The goal is just to build the habit \u2014 I'll keep an eye on upcoming cases and follow up if it's needed.`,
      `I want this to feel like coaching, not criticism, so I'll frame it around what support can add next time, not what went wrong this time.`,
    ]));
    if(met.length){
      tParts.push(pick([
        `I'll also make a point of recognizing the strong work in ${list(met.map(m=>lower(m.name)))}, since that's worth reinforcing.`,
        `Worth calling out too: ${list(met.map(m=>lower(m.name)))} was handled well, and I want support to know that landed.`,
      ]));
    }
  } else {
    tParts.push(pick([
      `Nothing to coach here \u2014 I'll make sure support hears that this case reflects the standard we want to see more of.`,
      `No coaching needed this time. I'll recognize the consistent work and use this as a positive example for the team.`,
    ]));
  }
  const tlNotes = tParts.join(' ');

  return { supportAction: supportAction.trim(), commitment: commitment.trim(), additional: additional.trim(), tlNotes: tlNotes.trim() };
}

/* ---------------------- TOASTS ---------------------- */
function toast(msg, isError){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast';
  if(isError) el.style.borderLeftColor = 'var(--red)';
  el.innerHTML = `<span>${esc(msg)}</span>`;
  wrap.appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='opacity 0.3s'; setTimeout(()=>el.remove(),300); }, 2600);
}
function toastRetry(msg){
  const wrap = document.getElementById('toastWrap');
  const el = document.createElement('div');
  el.className = 'toast';
  el.style.borderLeftColor = 'var(--red)';
  el.style.cursor = 'pointer';
  el.innerHTML = `<span>${esc(msg)}</span>`;
  el.addEventListener('click', ()=>{ el.remove(); saveState(); });
  wrap.appendChild(el);
  setTimeout(()=>{ if(el.isConnected){ el.style.opacity='0'; el.style.transition='opacity 0.3s'; setTimeout(()=>el.remove(),300); } }, 6000);
}
