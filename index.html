  if(!STATE.supports.length) return null;
  if(!STATE.viewerSupportId || !STATE.supports.find(s=>s.id===STATE.viewerSupportId)){
    STATE.viewerSupportId = sortedSupports()[0].id;
  }
  return STATE.viewerSupportId;
}
function openSupervisorModal(){
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
  <div class="modal-backdrop" id="supervisorBackdrop">
    <div class="modal" style="max-width:380px;">
      <div class="modal-head">
        <h3>Supervisor Access</h3>
        <button class="icon-btn" id="closeSupervisorModal"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>
      <div class="modal-body">
        <form id="supervisorForm">
          <div class="field" style="margin-bottom:14px;">
            <label class="field-label">Password</label>
            <input type="password" id="supervisorPassword" autocomplete="current-password" required autofocus>
          </div>
          <button type="submit" class="btn brass" style="width:100%;">Unlock</button>
        </form>
      </div>
    </div>
  </div>`;
  document.getElementById('closeSupervisorModal').addEventListener('click', ()=>root.innerHTML='');
  document.getElementById('supervisorBackdrop').addEventListener('click', (e)=>{ if(e.target.id==='supervisorBackdrop') root.innerHTML=''; });
  document.getElementById('supervisorForm').addEventListener('submit', (e)=>{
    e.preventDefault();
    const val = document.getElementById('supervisorPassword').value;
    if(val === SUPERVISOR_PASSWORD){
      supervisorUnlocked = true;
      localStorage.setItem(SUPERVISOR_AUTH_KEY, 'true');
      appMode = 'supervisor';
      localStorage.setItem(APP_MODE_KEY, 'supervisor');
      root.innerHTML = '';
      setView('dashboard');
      toast('Supervisor access unlocked');
    } else {
      toast('Incorrect password', true);
    }
  });
}

/* ---------------------- RENDER ROOT ---------------------- */
function render(){
  populateGlobalMonth();
  const c = document.getElementById('content');
  if(currentView==='dashboard') c.innerHTML = renderDashboard();
  else if(currentView==='counts') c.innerHTML = renderCounts();
  else if(currentView==='new') c.innerHTML = renderNewFeedback();
  else if(currentView==='records') c.innerHTML = renderRecords();
  else if(currentView==='supports') c.innerHTML = renderSupports();
  else if(currentView==='myDashboard') c.innerHTML = renderMyDashboard();

}

/* ======================================================================
   DASHBOARD (Supervisor)
   ====================================================================== */
function renderDashboard(){
  const months = allMonthsUsed();
  const thisMonthRecs = recordsFor(currentMonth);
  const teamAvg = avgPercent(thisMonthRecs);
  const target = getTarget(currentMonth);
  const rawRate = target>0 ? (thisMonthRecs.length/target) : null;
  const cappedRate = rawRate !== null ? Math.min(1, rawRate) : null;

  let totalAgentRates = 0;
  let countWithTarget = 0;
  sortedSupports().forEach(s=>{
    const adjusted = getAdjustedTarget(s.id, currentMonth);
    if(adjusted !== null && adjusted > 0){
      const monthCount = STATE.agentReviews.filter(a=>a.supportId===s.id && a.date && a.date.slice(0,7)===currentMonth).length;
      const rate = Math.min(1, monthCount / adjusted);
      totalAgentRates += rate;
      countWithTarget++;
    }
  });
  const avgAgentCompletion = countWithTarget > 0 ? (totalAgentRates / countWithTarget) : null;

  const rows = sortedSupports().map(sup=>{
    const cells = months.map(m=>{
      const recs = recordsFor(m, sup.id);
      const avg = avgPercent(recs);
      if(!recs.length) return `<td class="num" style="color:var(--slate-soft);">—</td>`;
      return `<td class="num"><span class="badge ${scoreBadgeClass(avg)}">${pctStr(avg)}</span> <span style="color:var(--slate-soft); font-size:11px;">(${recs.length})</span></td>`;
    }).join('');
    const supAll = recordsFor(null, sup.id).length ? STATE.records.filter(r=>r.supportId===sup.id) : [];
    const overallAvg = avgPercent(supAll);
    return `<tr><td style="font-weight:600;">${esc(sup.name)}</td>${cells}<td class="num"><span class="badge ${scoreBadgeClass(overallAvg)}">${pctStr(overallAvg)}</span></td></tr>`;
  }).join('');

  const teamOverallAvg = avgPercent(STATE.records);

  const agentReviewRows = sortedSupports().map(s=>{
    const mine = STATE.agentReviews.filter(a=>a.supportId===s.id);
    const rc = mine.filter(a=>a.mode==='review').length;
    const cc = mine.filter(a=>a.mode==='commendation').length;
    const monthCount = mine.filter(a=>a.date && a.date.slice(0,7)===currentMonth).length;
    const adjusted = getAdjustedTarget(s.id, currentMonth);
    const rate = (adjusted!==null && adjusted>0) ? Math.min(1, monthCount/adjusted) : null;
    return `<tr>
      <td style="font-weight:600;">${esc(s.name)}</td>
      <td class="num">${rc}</td>
      <td class="num">${cc}</td>
      <td class="num">${rc+cc}</td>
      <td class="num">${monthCount}</td>
      <td class="num">${rate===null ? '<span style="color:var(--slate-soft);">No target set</span>' : `<span class="badge ${rate>=1?'green':'neutral'}">${Math.round(rate*100)}%</span>`}</td>
    </tr>`;
  }).join('');

  return `
  <div class="stat-row">
    <div class="stat-card">
      <div class="label">Active Supports</div>
      <div class="value">${STATE.supports.length}</div>
      <div class="delta">on the current roster</div>
    </div>
    <div class="stat-card">
      <div class="label">${monthLabel(currentMonth)} SEQAS Review</div>
      <div class="value">${cappedRate===null ? '—' : Math.round(cappedRate*100)+'%'}</div>
      <div class="delta">${thisMonthRecs.length} / ${target} evaluations completed</div>
    </div>
    <div class="stat-card">
      <div class="label">Agent Reviews Progress</div>
      <div class="value">${avgAgentCompletion===null ? '—' : Math.round(avgAgentCompletion*100)+'%'}</div>
      <div class="delta">team average completion for ${monthLabel(currentMonth)}</div>
    </div>
  </div>

  <div class="card">
    <div class="card-header">
      <h3>Score Summary</h3>
      <span style="font-size:11.5px; color:var(--slate-soft);">${monthLabel(currentMonth)} average ${pctStr(teamAvg)} &middot; overall average ${pctStr(teamOverallAvg)}</span>
    </div>
    <div class="card-body" style="overflow-x:auto;">
      ${STATE.supports.length ? `
      <table>
        <thead><tr><th>Support</th>${months.map(m=>`<th>${monthLabel(m).slice(0,3).toUpperCase()} '${m.slice(2,4)}</th>`).join('')}<th>Overall</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>` : emptyState('No supports yet', 'Add your team on the Manage Supports tab to begin scoring.', 'supports','Add supports')}
    </div>
  </div>

  <div class="card" style="margin-top:20px;">
    <div class="card-header">
      <h3>Support Agent Reviews</h3>
      <span style="font-size:11.5px; color:var(--slate-soft);">Reviews and commendations submitted by each support for ${monthLabel(currentMonth)}</span>
    </div>
    <div class="card-body" style="overflow-x:auto;">
      ${STATE.supports.length ? `
      <table>
        <thead><tr><th>Support</th><th>Reviews</th><th>Commendations</th><th>Total</th><th>This Month</th><th>Progress</th></tr></thead>
        <tbody>${agentReviewRows}</tbody>
      </table>` : emptyState('No supports yet', 'Add your team on the Manage Supports tab.', 'supports','Add supports')}
    </div>
  </div>
  `;
}

/* ======================================================================
   REVIEW COUNT & TARGET
   ====================================================================== */
function renderCounts(){
  const months = allMonthsUsed();
  const rows = sortedSupports().map(sup=>{
    const cells = months.map(m=> `<td class="num">${recordsFor(m, sup.id).length || '<span style="color:var(--slate-soft);">0</span>'}</td>`).join('');
    return `<tr><td style="font-weight:600;">${esc(sup.name)}</td>${cells}</tr>`;
  }).join('');

  const totalCells = months.map(m=> `<td class="num">${recordsFor(m).length}</td>`).join('');
  const targetCells = months.map(m=> `<td class="num"><input type="number" min="0" class="target-input" data-target-month="${m}" value="${getTarget(m)}"></td>`).join('');
  const rateCells = months.map(m=>{
    const total = recordsFor(m).length;
    const target = getTarget(m);
    const rate = target>0 ? Math.min(1, total/target) : null;
    return `<td class="num"><span class="badge ${rate===null?'neutral':(rate>=1?'green':'red')}">${rate===null?'—':Math.round(rate*100)+'%'}</span></td>`;
  }).join('');

  const personalTargetRows = sortedSupports().map(sup=>{
    const cells = months.map(m=>{
      const key = personalTargetKey(sup.id, m);
      const stored = STATE.personalTargets[key];
      const val = (stored===undefined||stored===null||stored==='') ? '' : stored;
      return `<td class="num"><input type="number" min="0" class="target-input" placeholder="\u2014" data-personal-target-support="${sup.id}" data-personal-target-month="${m}" value="${val}"></td>`;
    }).join('');
    return `<tr><td style="font-weight:600;">${esc(sup.name)}</td>${cells}</tr>`;
  }).join('');

  const attendanceRows = sortedSupports().map(sup=>{
    const cells = months.map(m=>{
      const att = getAttendance(sup.id, m);
      const total = (Number(att.absent)||0)+(Number(att.vl)||0)+(Number(att.ml)||0)+(Number(att.el)||0);
      return `<td class="num">${total ? `A:${att.absent||0} VL:${att.vl||0} ML:${att.ml||0} EL:${att.el||0}` : '<span style="color:var(--slate-soft);">\u2014</span>'}</td>`;
    }).join('');
    return `<tr><td style="font-weight:600;">${esc(sup.name)}</td>${cells}</tr>`;
  }).join('');

  return `
  <div class="card">
    <div class="card-header">
      <h3>Review Count by Support</h3>
      <span style="font-size:11.5px; color:var(--slate-soft);">Number of evaluations logged per month</span>
    </div>
    <div class="card-body" style="overflow-x:auto;">
      ${STATE.supports.length ? `
      <table class="count-table">
        <thead><tr><th>Support</th>${months.map(m=>`<th>${monthLabel(m).slice(0,3).toUpperCase()} '${m.slice(2,4)}</th>`).join('')}</tr></thead>
        <tbody>${rows}</tbody>
        <tbody>
          <tr class="row-total"><td>Total</td>${totalCells}</tr>
          <tr><td style="font-weight:600;">Target <span style="font-weight:400; color:var(--slate-soft); font-size:11px;">(editable)</span></td>${targetCells}</tr>
          <tr><td style="font-weight:600;">Rate</td>${rateCells}</tr>
        </tbody>
      </table>` : emptyState('No supports yet', 'Add your team on the Manage Supports tab to begin tracking.', 'supports','Add supports')}
    </div>
  </div>
  <p class="field-hint" style="margin-top:14px;">The monthly target above is a team-wide goal (e.g. 8 or 16 total evaluations). Change any number above and it saves automatically.</p>

  <div class="card" style="margin-top:20px;">
    <div class="card-header">
      <h3>Personal Targets</h3>
      <span style="font-size:11.5px; color:var(--slate-soft);">Each support's monthly Agent Review goal \u2014 shown on their own dashboard, adjusted for attendance</span>
    </div>
    <div class="card-body" style="overflow-x:auto;">
      ${STATE.supports.length ? `
      <table class="count-table">
        <thead><tr><th>Support</th>${months.map(m=>`<th>${monthLabel(m).slice(0,3).toUpperCase()} '${m.slice(2,4)}</th>`).join('')}</tr></thead>
        <tbody>${personalTargetRows}</tbody>
      </table>` : emptyState('No supports yet', 'Add your team on the Manage Supports tab to begin tracking.', 'supports','Add supports')}
    </div>
  </div>

  <div class="card" style="margin-top:20px;">
    <div class="card-header">
      <h3>Attendance on File</h3>
      <span style="font-size:11.5px; color:var(--slate-soft);">Read-only \u2014 supports log this from their own dashboard</span>
    </div>
    <div class="card-body" style="overflow-x:auto;">
      ${STATE.supports.length ? `
      <table class="count-table">
        <thead><tr><th>Support</th>${months.map(m=>`<th>${monthLabel(m).slice(0,3).toUpperCase()} '${m.slice(2,4)}</th>`).join('')}</tr></thead>
        <tbody>${attendanceRows}</tbody>
      </table>` : emptyState('No supports yet', 'Add your team on the Manage Supports tab to begin tracking.', 'supports','Add supports')}
    </div>
  </div>
  `;
}

/* ======================================================================

   ====================================================================== */
function renderNewFeedback(){
  const editing = editingRecordId ? STATE.records.find(r=>r.id===editingRecordId) : null;
  const scores = editing ? editing.scores : {};
  const supOptions = sortedSupports().map(s=>`<option value="${s.id}" ${editing && editing.supportId===s.id ? 'selected':''}>${esc(s.name)}</option>`).join('');

  if(!STATE.supports.length){
    return emptyState('Add a support first', 'You need at least one support on the roster before logging an evaluation.', 'supports', 'Go to Manage Supports');
  }

  const notes = editing ? (editing.criteriaNotes || {}) : {};
  const scoreRows = CRITERIA.map(c=>{
    const val = scores[c.key];
    const options = c.max===1 ? [0,1] : [0,1,2];
    const optLabels = c.max===1 ? ['Not Met','Met'] : ['Not Met','Partial','Met'];
    const segButtons = options.map((o,i)=>`<button type="button" class="sel-${o} ${val===o?'active':''}" data-score-key="${c.key}" data-score-val="${o}">${optLabels[i]}</button>`).join('');
    const band = val===undefined ? 'unscored' : String(val);
    const noteVal = notes[c.key] || '';
    return `
    <div class="crit-card" data-band="${band}" data-crit-key="${c.key}">
      <div class="crit-head">
        <div class="crit-info">
          <div class="crit-name">${esc(c.name)}</div>
          <div class="crit-desc">${esc(c.desc)}</div>
        </div>
        <div class="seg">${segButtons}</div>
      </div>
      <div class="crit-note">
        <div class="note-label"><span class="req-dot"></span>Why this rating?</div>
        <textarea data-note-key="${c.key}" placeholder="${notePlaceholder(c, val)}">${esc(noteVal)}</textarea>
      </div>
      <button type="button" class="crit-info-toggle" data-crit-toggle="${c.key}">View full criteria \u25BE</button>
      <div class="crit-info-panel" id="critInfo-${c.key}">${esc(c.details)}</div>

  }).join('');

  return `
  <form id="feedbackForm">
    <div class="card">
      <div class="card-header"><h3>${editing?'Edit':'New'} Evaluation</h3><span style="font-size:11.5px; color:var(--slate-soft);">${monthLabel(currentMonth)}</span></div>
      <div class="card-body">
        <div class="field-grid">

            <label class="field-label">Support</label>
            <select id="f_support" required>${supOptions}</select>
          </div>
          <div class="field">
            <label class="field-label">Month</label>
            <input type="month" id="f_month" value="${editing?editing.month:monthKey(new Date())}" required>
          </div>
          <div class="field">
            <label class="field-label">Date of Evaluation</label>
            <input type="date" id="f_evalDate" value="${editing?editing.dateOfEval:''}" required>
          </div>
          <div class="field">
            <label class="field-label">Chat Date</label>
            <input type="date" id="f_chatDate" value="${editing?editing.chatDate:''}" required>
          </div>
          <div class="field">
            <label class="field-label">Agent Name</label>
            <input type="text" id="f_agent" placeholder="e.g. Maria Fernandez" value="${editing?esc(editing.agentName):''}" required>
          </div>
          <div class="field">
            <label class="field-label">Case Number</label>
            <input type="text" id="f_case" placeholder="e.g. 13587296" value="${editing?esc(editing.caseNumber):''}" required>
          </div>
        </div>
      </div>
    </div>

    <div id="previousReviewsPanel"></div>

    <div class="card" style="margin-top:20px;">
      <div class="card-header"><h3>Scoring</h3><span style="font-size:11.5px; color:var(--slate-soft);">Out of ${MAX_SCORE} points</span></div>
      <div class="card-body" id="scoreArea">${scoreRows}</div>
      <div style="padding:0 20px 20px 20px;">

          <div><div class="tlabel">Total Score</div><div class="tval" id="liveTotal">${editing?editing.total:0} <small>/ ${MAX_SCORE}</small></div></div>

              <button class="icon-btn" title="Edit" data-edit="${r.id}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg></button>
              <button class="icon-btn danger" title="Delete" data-delete="${r.id}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg></button>
            </td>
          </tr>`).join('')}
      </tbody>
    </table>
  `;
  wrap.querySelectorAll('[data-export]').forEach(b=>b.addEventListener('click', ()=>openExportModal(b.dataset.export)));
  wrap.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click', ()=>{ editingRecordId=b.dataset.edit; setView('new', {keepEditing:true}); }));
  wrap.querySelectorAll('[data-delete]').forEach(b=>b.addEventListener('click', ()=>confirmDeleteRecord(b.dataset.delete)));
}

/* ======================================================================

   ====================================================================== */
function renderMyDashboard(){
  if(!STATE.supports.length){
    return emptyState('No supports on the roster yet', 'Ask your supervisor to add you to the roster.', null, null);
  }
  const viewerId = ensureViewerSupport();
  const viewer = STATE.supports.find(s=>s.id===viewerId);
  const months = allMonthsUsed();
  const myAll = STATE.records.filter(r=>r.supportId===viewerId);
  const overallAvg = avgPercent(myAll);
  const thisMonthRecs = recordsFor(currentMonth, viewerId);
  const thisMonthAvg = avgPercent(thisMonthRecs);

  const rows = months.map(m=>{
    const recs = recordsFor(m, viewerId);
    const avg = avgPercent(recs);
    return `<tr>
      <td style="font-weight:600;">${monthLabel(m)}</td>
      <td class="num">${recs.length ? `<span class="badge ${scoreBadgeClass(avg)}">${pctStr(avg)}</span>` : '<span style="color:var(--slate-soft);">\u2014</span>'}</td>
      <td class="num">${recs.length}</td>
    </tr>`;

  const recentRows = myAll.slice().sort((a,b)=>(b.createdAt||0)-(a.createdAt||0)).slice(0,5).map(r=>`
    <tr>
      <td class="num">${fmtDate(r.dateOfEval)}</td>
      <td class="agent-name">${esc(r.agentName)}</td>
      <td class="num">${esc(r.caseNumber)}</td>
      <td><span class="badge ${scoreBadgeClass(r.percent)}">${r.total}/${MAX_SCORE} &middot; ${pctStr(r.percent)}</span></td>
    </tr>`).join('');

  const thisMonthTarget = getPersonalTarget(viewerId, currentMonth);
  const att = getAttendance(viewerId, currentMonth);
  const leaveDays = (Number(att.absent)||0)+(Number(att.vl)||0)+(Number(att.ml)||0)+(Number(att.el)||0);
  const adjustedTarget = getAdjustedTarget(viewerId, currentMonth);

  const myAgentAll = STATE.agentReviews.filter(a=>a.supportId===viewerId);
  const myAgentThisMonth = myAgentAll.filter(a=>a.date && a.date.slice(0,7)===currentMonth);
  const reviewCount = myAgentAll.filter(a=>a.mode==='review').length;
  const commendationCount = myAgentAll.filter(a=>a.mode==='commendation').length;
  const reviewCountMonth = myAgentThisMonth.filter(a=>a.mode==='review').length;
  const commendationCountMonth = myAgentThisMonth.filter(a=>a.mode==='commendation').length;
  const rawRate = (adjustedTarget!==null && adjustedTarget>0) ? myAgentThisMonth.length/adjustedTarget : null;
  const completionRate = rawRate !== null ? Math.min(1, rawRate) : null;

  return `
  <div class="card" style="margin-bottom:20px;">
    <div class="card-body" style="display:flex; align-items:center; gap:14px;">
      <div class="seal" style="width:40px;height:40px;font-size:15px;">${esc(viewer.name.split(' ').map(w=>w[0]).slice(0,2).join('').toUpperCase())}</div>
      <div>
        <div style="font-weight:700; font-size:16px; color:var(--ink-text);">${esc(viewer.name)}</div>
        <div style="font-size:12px; color:var(--slate-soft);">${myAll.length} SEQAS evaluation${myAll.length===1?'':'s'} &middot; ${myAgentAll.length} agent entr${myAgentAll.length===1?'y':'ies'} on file</div>
      </div>
    </div>
  </div>

  <div class="section-divider"><h3>SEQAS Review</h3></div>

  <div class="stat-row" style="grid-template-columns:repeat(2,1fr);">
    <div class="stat-card">
      <div class="label">Overall Average</div>
      <div class="value">${pctStr(overallAvg)}</div>
      <div class="delta">across ${myAll.length} evaluation${myAll.length===1?'':'s'}</div>
    </div>
    <div class="stat-card">
      <div class="label">${monthLabel(currentMonth)} Average</div>
      <div class="value">${pctStr(thisMonthAvg)}</div>
      <div class="delta">${thisMonthRecs.length} evaluation${thisMonthRecs.length===1?'':'s'} this month</div>
    </div>
  </div>

  <div class="card">
    <div class="card-header"><h3>Score by Month</h3></div>
    <div class="card-body" style="overflow-x:auto;">
      <table>
        <thead><tr><th>Month</th><th>Average</th><th>Reviews</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  </div>

  <div class="card" style="margin-top:20px;">
    <div class="card-header"><h3>Most Recent Evaluations</h3><span style="font-size:11.5px; color:var(--slate-soft);">See SEQAS Records for the full list</span></div>
    <div class="card-body" style="overflow-x:auto;">
      ${recentRows ? `<table><thead><tr><th>Date</th><th>Agent</th><th>Case #</th><th>Score</th></tr></thead><tbody>${recentRows}</tbody></table>` : emptyState('No evaluations yet', 'Your evaluations will show up here once your supervisor logs one.', null, null)}

  <div class="section-divider"><h3>Agent Review</h3></div>

  <div class="stat-row">
    <div class="stat-card">
      <div class="label">${monthLabel(currentMonth)} Target Progress</div>

      <div class="delta">
        ${adjustedTarget===null
          ? 'Ask your supervisor to set your monthly target'

      <div class="label">Reviews Submitted</div>
      <div class="value">${reviewCount}</div>
      <div class="delta">${reviewCountMonth} this month</div>
    </div>
    <div class="stat-card">
      <div class="label">Commendations Submitted</div>
      <div class="value">${commendationCount}</div>
      <div class="delta">${commendationCountMonth} this month</div>
    </div>
  </div>

  <div class="card" style="margin-bottom:20px;">
    <div class="card-header">
      <h3>Agent Entries</h3>
      <div style="display:flex; align-items:center; gap:12px;">

        <button class="btn ghost sm" data-goto="agentReviews">Log a new entry</button>
      </div>
    </div>
    <div class="card-body" id="dashAgentEntriesWrap" style="overflow-x:auto;"></div>
  </div>

  <div class="card attendance-compact">
    <div class="card-header"><h3>Attendance</h3><span style="font-size:11px; color:var(--slate-soft);">${monthLabel(currentMonth)} \u2014 adjusts your Agent Review target above</span></div>

        <div class="field" style="margin-bottom:0; width:70px;"><label class="field-label">Absent</label><input type="number" min="0" id="att_absent" value="${att.absent||0}"></div>
        <div class="field" style="margin-bottom:0; width:70px;"><label class="field-label">VL</label><input type="number" min="0" id="att_vl" value="${att.vl||0}"></div>
        <div class="field" style="margin-bottom:0; width:70px;"><label class="field-label">ML</label><input type="number" min="0" id="att_ml" value="${att.ml||0}"></div>
        <div class="field" style="margin-bottom:0; width:70px;"><label class="field-label">EL</label><input type="number" min="0" id="att_el" value="${att.el||0}"></div>
        <button type="submit" class="btn brass sm">Save</button>
      </form>
      <p class="field-hint" style="margin:10px 0 0 0;">${thisMonthTarget===null ? 'No monthly target has been set for you yet \u2014 attendance will apply once your supervisor sets one.' : `Base target this month: <strong>${thisMonthTarget}</strong>. Days off reduce it proportionally.`}</p>
    </div>
  </div>
  `;
}

function buildAgentEntryText(e){
  const lines = [];
  const meta = [];
  if(e.agentName) meta.push('Agent: '+e.agentName);
  if(e.caseNumber) meta.push('Case: '+e.caseNumber);
  if(meta.length){ lines.push(meta.join('   |   ')); lines.push(''); }
  if(e.mode==='review'){
    if(e.category) lines.push('Type of Issue: '+e.category);
    if(e.level) lines.push('Severity: '+e.level);
    lines.push('');
    lines.push('1. Interaction Summary'); lines.push(e.section1||'');
    lines.push('');
    lines.push('2. Gap Identified'); lines.push(e.section2||'');
    lines.push('');
    lines.push('3. Opportunities & Recommended Actions'); lines.push(e.section3||'');
    if(e.section4){ lines.push(''); lines.push('4. Positive Observations'); lines.push(e.section4); }
  } else {
    if(e.category) lines.push('Category: '+e.category);
    if(e.level) lines.push('Impact Level: '+e.level);
    lines.push('');
    lines.push('1. What Went Well'); lines.push(e.section1||'');
    lines.push('');
    lines.push('2. Key Strengths Displayed'); lines.push(e.section2||'');
    lines.push('');
    lines.push('3. Business Impact & Recognition'); lines.push(e.section3||'');
  }
  return lines.join('\n');
}

function readAgentReviewForm(){
  const kind = agentReviewKind;
  const viewerId = ensureViewerSupport();
  const viewer = STATE.supports.find(s=>s.id===viewerId);
  const base = {
    mode: kind,
    supportId: viewerId,
    supportName: viewer ? viewer.name : '',
    agentName: document.getElementById('ar_agent').value.trim(),
    caseNumber: document.getElementById('ar_case').value.trim(),
    category: document.getElementById('ar_category').value,
    level: document.getElementById('ar_level').value,

  if(kind==='review'){
    base.section1 = document.getElementById('ar_s1').value.trim();
    base.section2 = document.getElementById('ar_s2').value.trim();
    base.section3 = document.getElementById('ar_s3').value.trim();
    base.section4 = document.getElementById('ar_s4').value.trim();
  } else {
    base.section1 = document.getElementById('ar_c1').value.trim();
    base.section2 = document.getElementById('ar_c2').value.trim();
    base.section3 = document.getElementById('ar_c3').value.trim();
    base.section4 = '';
  }
  return base;
}
function validateAgentReviewForm(d){
  const missing = [];
  if(!d.category) missing.push(d.mode==='review' ? 'Type of Issue' : 'Category');
  if(!d.section1) missing.push(d.mode==='review' ? 'Interaction Summary' : 'What Went Well');
  if(!d.section2) missing.push(d.mode==='review' ? 'Gap Identified' : 'Key Strengths Displayed');
  if(!d.section3) missing.push(d.mode==='review' ? 'Opportunities & Recommended Actions' : 'Business Impact & Recognition');
  return missing;
}

async function deleteAgentReviewEntry(id, refreshFn){
  const entry = STATE.agentReviews.find(a=>a.id===id);
  if(!entry) return;
  if(!confirm('Delete this entry? This can\u2019t be undone.')) return;
  STATE.agentReviews = STATE.agentReviews.filter(a=>a.id!==id);
  STATE.deletedAgentReviewIds = STATE.deletedAgentReviewIds || [];
  if(!STATE.deletedAgentReviewIds.includes(id)) STATE.deletedAgentReviewIds.push(id);
  if(refreshFn) refreshFn();
  const ok = await saveState();
  if(ok){
    toast('Entry deleted for good \u2014 it won\u2019t come back on refresh.');
  } else {
    toastRetry('Deleted here, but the save failed \u2014 tap to retry so it stays deleted.');
  }
}

/* ======================================================================
   EVENT HANDLERS PER VIEW
   ====================================================================== */
function attachViewHandlers(){
  document.querySelectorAll('[data-goto]').forEach(b=>b.addEventListener('click', ()=>setView(b.dataset.goto)));

  if(currentView==='counts'){
    document.querySelectorAll('[data-target-month]').forEach(inp=>{
      inp.addEventListener('change', async ()=>{
        const m = inp.dataset.targetMonth;
        const v = Math.max(0, parseInt(inp.value)||0);
        STATE.targets[m] = v;
        await saveState();
        render();
        toast('Target updated');
      });
    });
    document.querySelectorAll('[data-personal-target-support]').forEach(inp=>{
      inp.addEventListener('change', async ()=>{
        const supId = inp.dataset.personalTargetSupport;
        const m = inp.dataset.personalTargetMonth;
        const key = personalTargetKey(supId, m);
        if(inp.value === ''){ delete STATE.personalTargets[key]; }
        else { STATE.personalTargets[key] = Math.max(0, parseInt(inp.value)||0); }
        await saveState();
        toast('Personal target updated');
      });
    });
  }

  if(currentView==='new'){
    const existing = editingRecordId ? STATE.records.find(r=>r.id===editingRecordId) : null;
    let liveScores = existing ? {...existing.scores} : {};
    let liveNotes = existing ? {...(existing.criteriaNotes||{})} : {};

    function renderPrevReviews(){
      const panel = document.getElementById('previousReviewsPanel');
      if(!panel) return;
      const supId = document.getElementById('f_support').value;
      const month = document.getElementById('f_month').value;
      const prior = STATE.records
        .filter(r=>r.supportId===supId && r.month===month && r.id!==editingRecordId)
        .sort((a,b)=>(a.createdAt||0)-(b.createdAt||0));
      if(!prior.length){ panel.innerHTML=''; return; }
      panel.innerHTML = `
        <div class="prev-reviews">
          <div class="prev-title">Already on file for ${monthLabel(month)}</div>
          ${prior.map(p=>`
            <div class="prev-item">
              <span>${fmtDate(p.dateOfEval)} &middot; agent <span class="agent-name">${esc(p.agentName)}</span> &middot; case ${esc(p.caseNumber)}</span>
              <span class="badge ${scoreBadgeClass(p.percent)}">${p.total}/${MAX_SCORE} &middot; ${pctStr(p.percent)}</span>
            </div>`).join('')}
        </div>`;
    }
    renderPrevReviews();
    document.getElementById('f_support').addEventListener('change', renderPrevReviews);
    document.getElementById('f_month').addEventListener('change', renderPrevReviews);

    document.querySelectorAll('[data-score-key]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const key = btn.dataset.scoreKey, val = parseInt(btn.dataset.scoreVal);
        liveScores[key] = val;
        document.querySelectorAll(`[data-score-key="${key}"]`).forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        const card = document.querySelector(`.crit-card[data-crit-key="${key}"]`);
        if(card){
          card.dataset.band = String(val);
          const c = CRITERIA.find(cc=>cc.key===key);
          const ta = card.querySelector('textarea[data-note-key]');
          if(ta) ta.placeholder = notePlaceholder(c, val);
        }
        const total = Object.values(liveScores).reduce((s,v)=>s+v,0);
        document.getElementById('liveTotal').innerHTML = `${total} <small>/ ${MAX_SCORE}</small>`;
        document.getElementById('livePercent').textContent = Math.round((total/MAX_SCORE)*100)+'%';
      });
    });

    document.querySelectorAll('textarea[data-note-key]').forEach(ta=>{
      ta.addEventListener('input', ()=>{ liveNotes[ta.dataset.noteKey] = ta.value; });
    });

    document.querySelectorAll('[data-crit-toggle]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const key = btn.dataset.critToggle;
        const panel = document.getElementById('critInfo-'+key);
        const isOpen = panel.classList.toggle('open');
        btn.textContent = isOpen ? 'Hide full criteria \u25B4' : 'View full criteria \u25BE';
      });
    });

    const genBtn = document.getElementById('generateSummaryBtn');
    if(genBtn){
      genBtn.addEventListener('click', ()=>{
        if(Object.keys(liveScores).length < CRITERIA.length){
          toast('Score every criterion first \u2014 the summary is built from those ratings.', true);
          return;
        }
        const summary = buildSummary(liveScores, liveNotes);
        document.getElementById('f_supportAction').value = summary.supportAction;
        document.getElementById('f_commitment').value = summary.commitment;
        document.getElementById('f_additional').value = summary.additional;
        document.getElementById('f_tlNotes').value = summary.tlNotes;
        toast('Summary generated \u2014 feel free to fine-tune the wording.');
      });
    }

    document.getElementById('feedbackForm').addEventListener('submit', async (e)=>{
      e.preventDefault();
      if(Object.keys(liveScores).length < CRITERIA.length){
        toast('Please score every criterion before saving.', true);
        return;
      }
      const total = Object.values(liveScores).reduce((s,v)=>s+v,0);
      const percent = total/MAX_SCORE;
      const supportId = document.getElementById('f_support').value;
      const support = STATE.supports.find(s=>s.id===supportId);
      const record = {
        id: editingRecordId || uid('rec'),
        month: document.getElementById('f_month').value || currentMonth,
        supportId, supportName: support?support.name:'',
        dateOfEval: document.getElementById('f_evalDate').value,
        chatDate: document.getElementById('f_chatDate').value,
        agentName: document.getElementById('f_agent').value,
        caseNumber: document.getElementById('f_case').value,
        scores: liveScores, criteriaNotes: liveNotes, total, percent,
        supportAction: document.getElementById('f_supportAction').value,
        commitmentObservations: document.getElementById('f_commitment').value,
        additionalActions: document.getElementById('f_additional').value,
        tlCommitment: document.getElementById('f_tlNotes').value,
        createdAt: editingRecordId ? (existing?.createdAt || Date.now()) : Date.now(),
        updatedAt: Date.now()
      };
      if(editingRecordId){
        const idx = STATE.records.findIndex(r=>r.id===editingRecordId);
        STATE.records[idx] = record;
      } else {
        STATE.records.push(record);
      }
      currentMonth = record.month;
      localStorage.setItem(LAST_MONTH_KEY, currentMonth);
      await saveState();
      // Safety net: confirm this evaluation is still present after saveState()
      // (which may merge with a synced copy). If it's ever missing, put it
      // back and save again so it can't disappear on refresh.
      if(!STATE.records.some(r=>r.id===record.id)){
        STATE.records.push(record);
        try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); }catch(e){}
        await saveState();
      }
      toast(editingRecordId ? 'Evaluation updated' : 'Evaluation saved');
      editingRecordId = null;
      setView('records');
    });
    const cancelBtn = document.getElementById('cancelEdit');
    if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ editingRecordId=null; setView('records'); });
  }

  if(currentView==='records'){
    renderRecordsTable();
    document.getElementById('filterMonth').addEventListener('change', renderRecordsTable);
    document.getElementById('filterSupport').addEventListener('change', renderRecordsTable);
  }

  if(currentView==='myDashboard'){
    const form = document.getElementById('attendanceForm');
    if(form){
      form.addEventListener('submit', async (e)=>{
        e.preventDefault();
        const viewerId = ensureViewerSupport();
        const key = personalTargetKey(viewerId, currentMonth);
        STATE.attendance[key] = {
          absent: Math.max(0, parseInt(document.getElementById('att_absent').value)||0),
          vl: Math.max(0, parseInt(document.getElementById('att_vl').value)||0),
          ml: Math.max(0, parseInt(document.getElementById('att_ml').value)||0),
          el: Math.max(0, parseInt(document.getElementById('att_el').value)||0),
        };
        await saveState();
        render();
        toast('Attendance saved');
      });
    }
    renderDashboardAgentEntriesTable();
    const dashMonthFilterEl = document.getElementById('dashAgentReviewMonthFilter');
    if(dashMonthFilterEl) dashMonthFilterEl.addEventListener('change', renderDashboardAgentEntriesTable);
  }

  if(currentView==='myRecords'){
    renderMyRecordsTable();
    const sel = document.getElementById('myRecordsSupportFilter');
    if(sel){
      sel.addEventListener('change', async ()=>{
        STATE.viewerSupportId = sel.value;
        await saveState();
        renderViewerPicker();
        renderMyRecordsTable();
      });
    }
  }

  if(currentView==='agentReviews'){
    if(appMode==='support'){
      const editingEntry = editingAgentReviewId ? STATE.agentReviews.find(a=>a.id===editingAgentReviewId) : null;
      agentReviewKind = editingEntry ? editingEntry.mode : 'review';
      updateAgentReviewModeUI();
      if(editingEntry){
        document.getElementById('ar_category').value = editingEntry.category || '';
        document.getElementById('ar_level').value = editingEntry.level || '';
      }
      renderMyAgentReviewsTable();
      const monthFilterEl = document.getElementById('myAgentReviewMonthFilter');
      if(monthFilterEl) monthFilterEl.addEventListener('change', renderMyAgentReviewsTable);
      document.querySelectorAll('#arKindToggle [data-ar-kind]').forEach(btn=>{
        btn.addEventListener('click', ()=>{
          agentReviewKind = btn.dataset.arKind;
          updateAgentReviewModeUI();
        });
      });
      document.getElementById('ar_previewBtn').addEventListener('click', ()=>{
        const d = readAgentReviewForm();
        const missing = validateAgentReviewForm(d);
        if(missing.length){ toast('Please complete: ' + missing.join(', '), true); return; }
        document.getElementById('ar_previewText').textContent = buildAgentEntryText(d);
        document.getElementById('ar_previewCard').style.display = 'block';
      });
      document.getElementById('ar_copyBtn').addEventListener('click', ()=>{
        const d = readAgentReviewForm();
        navigator.clipboard.writeText(buildAgentEntryText(d)).then(()=>toast('Copied to clipboard')).catch(()=>toast('Could not copy \u2014 select and copy manually.', true));
      });
      const cancelBtn = document.getElementById('ar_cancelEditBtn');
      if(cancelBtn) cancelBtn.addEventListener('click', ()=>{ editingAgentReviewId = null; setView('agentReviews'); });
      document.getElementById('agentReviewForm').addEventListener('submit', async (e)=>{
        e.preventDefault();
        const d = readAgentReviewForm();
        const missing = validateAgentReviewForm(d);
        if(missing.length){ toast('Please complete: ' + missing.join(', '), true); return; }
        if(editingAgentReviewId){
          const idx = STATE.agentReviews.findIndex(a=>a.id===editingAgentReviewId);
          if(idx>-1) STATE.agentReviews[idx] = { ...STATE.agentReviews[idx], ...d };
          await saveState();
          editingAgentReviewId = null;
          toast('Entry updated');
          setView('agentReviews');
        } else {
          const entry = { id: uid('ar'), date: new Date().toISOString().slice(0,10), createdAt: Date.now(), ...d };
          STATE.agentReviews.push(entry);
          await saveState();
          e.target.reset();
          agentReviewKind = 'review';
          updateAgentReviewModeUI();
          renderMyAgentReviewsTable();
          toast(entry.mode==='commendation' ? 'Commendation added' : 'Review added');
        }
      });
    } else {
      renderAllAgentReviewsTable();
      document.getElementById('arFilterSupport').addEventListener('change', renderAllAgentReviewsTable);
      document.getElementById('arFilterKind').addEventListener('change', renderAllAgentReviewsTable);
    }
  }

  if(currentView==='supports'){
    document.getElementById('addSupportForm').addEventListener('submit', async (e)=>{
      e.preventDefault();
      const inp = document.getElementById('newSupportName');
      const name = inp.value.trim();
      if(!name) return;
      STATE.supports.push({ id: uid('sup'), name });
      await saveState();
      inp.value='';
      render();
      toast('Support added');
    });
    document.querySelectorAll('[data-remove-support]').forEach(btn=>{
      btn.addEventListener('click', async ()=>{
        const id = btn.dataset.removeSupport;
        const sup = STATE.supports.find(s=>s.id===id);
        if(!confirm(`Remove ${sup.name} from the active roster? Their past evaluations will stay on record.`)) return;
        STATE.supports = STATE.supports.filter(s=>s.id!==id);
        await saveState();
        render();
        toast('Support removed');
      });
    });

    document.getElementById('downloadBackupBtn').addEventListener('click', downloadBackup);
    document.getElementById('restoreBackupBtn').addEventListener('click', ()=>{
      document.getElementById('restoreFileInput').click();
    });
    document.getElementById('restoreFileInput').addEventListener('change', handleRestoreFile);

    document.getElementById('saveSyncUrlBtn').addEventListener('click', async ()=>{
      const val = document.getElementById('syncUrlInput').value.trim();
      SYNC_URL = val;
      try{ localStorage.setItem(SYNC_URL_KEY, SYNC_URL); }catch(e){}
      if(SYNC_URL){
        toast('Sync URL saved \u2014 syncing now\u2026');
        await syncNow();
        toast(lastSyncStatus==='error' ? 'Saved, but the first sync failed \u2014 check the URL' : 'Connected and synced');

        toast('Sync URL cleared');
      }
      render();

      syncNowBtn.addEventListener('click', async ()=>{
        toast('Syncing\u2026');
        await syncNow();
        try{ localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE)); }catch(e){}
        toast(lastSyncStatus==='error' ? 'Sync failed \u2014 check the URL and your connection' : 'Synced');
        render();
      });

    const disconnectBtn = document.getElementById('disconnectSyncBtn');
    if(disconnectBtn){
      disconnectBtn.addEventListener('click', ()=>{
        if(!confirm('Disconnect from Team Sync? Your data stays on this device, but you\u2019ll stop sharing with the team until you reconnect.')) return;
        SYNC_URL = '';
        try{ localStorage.setItem(SYNC_URL_KEY, ''); }catch(e){}
        lastSyncStatus = null;
        render();
        toast('Disconnected');
      });
    }
  }
}

function downloadBackup(){
  try{
    const blob = new Blob([JSON.stringify(STATE, null, 2)], { type:'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const stamp = new Date().toISOString().slice(0,10);
    a.href = url;
    a.download = `SEQAS_Review_backup_${stamp}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    toast('Backup downloaded');
  }catch(e){
    console.error(e);
    toast('Could not create the backup file.', true);
  }
}

function handleRestoreFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (ev)=>{
    try{
      const parsed = JSON.parse(ev.target.result);
      if(!parsed || !Array.isArray(parsed.records) || !Array.isArray(parsed.supports)){
        toast('That file doesn\u2019t look like a SEQAS Review backup.', true);
        return;
      }
      if(!confirm(`Restore this backup? It will replace everything currently in the app (${parsed.records.length} evaluations, ${parsed.supports.length} supports).`)) return;
      STATE = {
        supports: parsed.supports || [],
        targets: parsed.targets || {},
        records: parsed.records || [],
        seededAugust2026: !!parsed.seededAugust2026,
        deletedCaseNumbers: parsed.deletedCaseNumbers || [],
        deletedRecordIds: parsed.deletedRecordIds || [],
        augustAccuracyApplied: !!parsed.augustAccuracyApplied
      };
      const ok = await saveState();
      if(ok){ toast('Backup restored'); render(); }
      else{ toast('Restored here, but saving it failed \u2014 tap the save status to retry.', true); render(); }
    }catch(err){
      console.error(err);
      toast('Could not read that file. Make sure it\u2019s a SEQAS Review backup.', true);
    }
  };
  reader.readAsText(file);
  e.target.value = '';
}

async function confirmDeleteRecord(id){
  const rec = STATE.records.find(r=>r.id===id);
  if(!rec) return;
  if(!confirm(`Delete the ${monthLabel(rec.month)} evaluation for ${rec.supportName}? This can't be undone.`)) return;
  STATE.records = STATE.records.filter(r=>r.id!==id);
  if(rec.caseNumber){
    STATE.deletedCaseNumbers = STATE.deletedCaseNumbers || [];
    if(!STATE.deletedCaseNumbers.includes(String(rec.caseNumber))){
      STATE.deletedCaseNumbers.push(String(rec.caseNumber));
    }
  }
  STATE.deletedRecordIds = STATE.deletedRecordIds || [];
  if(!STATE.deletedRecordIds.includes(id)) STATE.deletedRecordIds.push(id);
  renderRecordsTable();
  const ok = await saveState();
  if(ok){
    toast('Evaluation deleted for good \u2014 it won\u2019t come back on refresh.');
  } else {
    toastRetry('Deleted here, but the save failed \u2014 tap to retry so it stays deleted.');
  }
}

}

function generatePdf(r, subject){
  try{
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit:'pt', format:'a4' });
    const marginX = 48;
    let y = 56;
    const pageWidth = doc.internal.pageSize.getWidth();

    doc.setFillColor(9,60,93);
    doc.rect(0,0,pageWidth,64,'F');
    doc.setTextColor(255,255,255);
    doc.setFont('helvetica','bold'); doc.setFontSize(17);
    doc.text('SEQAS REVIEW', marginX, 34);
    doc.setFont('helvetica','normal'); doc.setFontSize(10.5);
    doc.text(`${r.supportName}  |  ${subject.split('|')[1].trim()}`, marginX, 50);

    y = 96;
    doc.setTextColor(28,43,58);

    const kv = [
      ['DATE OF EVALUATION', fmtDate(r.dateOfEval), false],
      ['CHAT DATE', fmtDate(r.chatDate), false],
      ['SUPPORT NAME', r.supportName, false],
      ['AGENT NAME', r.agentName, true],
      ['CASE NUMBER', String(r.caseNumber), false],
      ['REVIEW SCORE', `${r.total}/${MAX_SCORE}  (${Math.round(r.percent*100)}%)`, false],
    ];
    const rowH = 22;
    kv.forEach((pair, i)=>{
      const ry = y + i*rowH;
      doc.setFillColor(i%2===0 ? 234 : 247, i%2===0 ? 244 : 250, i%2===0 ? 251 : 253);
      doc.rect(marginX, ry-14, pageWidth-marginX*2, rowH, 'F');
      doc.setDrawColor(214,229,240);
      doc.rect(marginX, ry-14, pageWidth-marginX*2, rowH, 'S');
      doc.setFont('helvetica','bold'); doc.setFontSize(9);
      doc.setTextColor(92,98,112);
      doc.text(pair[0], marginX+10, ry);
      doc.setFont('helvetica', pair[2] ? 'italic' : 'normal'); doc.setFontSize(11);
      doc.setTextColor(28,43,58);
      doc.text(String(pair[1]), marginX+190, ry);
    });
    y = y + kv.length*rowH + 24;

    const sections = [
      ['Support Action', r.supportAction],
      ['Commitment Met / Observations', r.commitmentObservations],
      ['Additional Actions That Could Be Performed', r.additionalActions],
      ['TL Commitment and Coaching Notes', r.tlCommitment],
    ];
    sections.forEach(([title, body])=>{
      if(y > 740){ doc.addPage(); y = 56; }
      doc.setDrawColor(59,117,151);
      doc.setLineWidth(1.4);
      doc.line(marginX, y, marginX+34, y);
      doc.setFont('helvetica','bold'); doc.setFontSize(12.5);
      doc.setTextColor(28,43,58);
      doc.text(title, marginX, y-6);
      y += 16;
      doc.setFont('helvetica','normal'); doc.setFontSize(10.5);
      doc.setTextColor(28,43,58);
      const lines = doc.splitTextToSize(body && body.trim() ? body : '\u2014', pageWidth - marginX*2);
      lines.forEach(line=>{
        if(y > 780){ doc.addPage(); y = 56; }
        doc.text(line, marginX, y);
        y += 14;
      });
      y += 16;
    });

    const fname = `SEQAS_${r.supportName.replace(/\s+/g,'_')}_${r.month}.pdf`;
    doc.save(fname);
    toast('PDF downloaded');
  }catch(e){
    console.error(e);
    toast('Could not generate the PDF in this browser.', true);
  }
}

function renderLoadFailureScreen(){
  const isParseError = lastLoadError && lastLoadError.type === 'parse';
  const isUnavailable = lastLoadError && lastLoadError.type === 'unavailable';
  const wrap = document.getElementById('loading');
  wrap.innerHTML = `
    <div class="seal-lg" style="border-color:var(--red); color:var(--red);">!</div>
    <p style="max-width:340px; text-align:center; margin-bottom:2px;">
      ${isUnavailable
        ? 'This browser is blocking local storage, so nothing can be saved here. This usually happens in private/incognito windows, or if a browser setting has storage turned off for this file. Try opening this file in a normal browser window.'
        : isParseError
        ? 'Your saved data came back, but it could not be read \u2014 it may be corrupted. Retrying won\u2019t fix this on its own.'
        : 'Couldn\u2019t reach your saved data. Refreshing now could risk overwriting it, so nothing has loaded yet.'}
    </p>
    <p style="max-width:340px; text-align:center; font-size:11.5px; color:var(--slate-soft); font-family:'IBM Plex Mono',monospace;">
      ${esc(lastLoadError ? lastLoadError.message : 'Unknown error')}
    </p>
    <div style="display:flex; gap:10px; flex-wrap:wrap; justify-content:center; margin-top:6px;">
      <button type="button" class="btn brass" id="retryLoadBtn">Try Again</button>
      <button type="button" class="btn ghost" id="restoreFromFailBtn">Restore from Backup File</button>
      ${isParseError && lastRawValue ? '<button type="button" class="btn ghost" id="downloadRawBtn">Download Raw Data</button>' : ''}
    </div>
    <input type="file" id="failRestoreInput" accept="application/json" style="display:none;">
    <button type="button" id="startFreshBtn" style="background:none;border:none;color:var(--slate-soft);font-size:11.5px;text-decoration:underline;cursor:pointer;margin-top:18px;">
      Nothing works \u2014 start with a blank workspace instead
    </button>
  `;
  document.getElementById('retryLoadBtn').addEventListener('click', ()=>location.reload());

  document.getElementById('restoreFromFailBtn').addEventListener('click', ()=>{
    document.getElementById('failRestoreInput').click();
  });
  document.getElementById('failRestoreInput').addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const reader = new FileReader();
    reader.onload = async (ev)=>{
      try{
        const parsed = JSON.parse(ev.target.result);
        if(!parsed || !Array.isArray(parsed.records) || !Array.isArray(parsed.supports)){
          alert('That file doesn\u2019t look like a SEQAS Review backup.');
          return;
        }
        if(!confirm(`Restore this backup? (${parsed.records.length} evaluations, ${parsed.supports.length} supports). This will save it as your current data.`)) return;
        STATE = {
          supports: parsed.supports || [],
          targets: parsed.targets || {},
          records: parsed.records || [],
          seededAugust2026: !!parsed.seededAugust2026,
          deletedCaseNumbers: parsed.deletedCaseNumbers || [],
          deletedRecordIds: parsed.deletedRecordIds || [],
          augustAccuracyApplied: !!parsed.augustAccuracyApplied
        };
        const ok = await saveState();
        if(ok){
          loadFailed = false;
          location.reload();
        } else {
          alert('Restored in memory, but saving it back failed. Check your connection and try again before reloading.');
        }
      }catch(err){
        alert('Could not read that file. Make sure it\u2019s a SEQAS Review backup.');
      }
    };
    reader.readAsText(file);
  });

  const downloadBtn = document.getElementById('downloadRawBtn');
  if(downloadBtn){
    downloadBtn.addEventListener('click', ()=>{
      const blob = new Blob([lastRawValue], { type:'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = 'SEQAS_Review_raw_data.json';
      document.body.appendChild(a); a.click(); a.remove();
      URL.revokeObjectURL(url);
    });
  }

  document.getElementById('startFreshBtn').addEventListener('click', async ()=>{
    if(!confirm('This clears everything and starts a brand-new blank workspace. Only do this if retrying and restoring a backup both didn\u2019t work. Continue?')) return;
    STATE = seedState();
    loadFailed = false;
    await saveState();
    location.reload();
  });
}

async function init(){
  const ok = await loadState();
  if(!ok){
    renderLoadFailureScreen();
    return;
  }
  await ensureAugustSeed();
  await ensureAugustNotes();
  await ensureAugustAccuracy();
  await ensureAgentReviewAugustSeed();
  ensureViewerSupport();

  // Remember month selection on change
  document.getElementById('globalMonth').addEventListener('change', (e)=>{
    currentMonth = e.target.value;
    localStorage.setItem(LAST_MONTH_KEY, currentMonth);
    render();
  });

  document.querySelectorAll('#modeToggle [data-mode]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const target = btn.dataset.mode;
      if(target === appMode) return;
      if(target === 'supervisor'){
        if(supervisorUnlocked){
          appMode='supervisor';
          localStorage.setItem(APP_MODE_KEY, 'supervisor');
          setView('dashboard');
        } else {
          openSupervisorModal();
        }
      } else {
        appMode = 'support';
        localStorage.setItem(APP_MODE_KEY, 'support');
        setView('myDashboard');
      }
    });
  });

  document.getElementById('saveStatus').addEventListener('click', ()=>{
    if(document.getElementById('saveStatus').classList.contains('error')) saveState();
  });

  setView(appMode === 'supervisor' ? 'dashboard' : 'myDashboard');
  document.getElementById('loading').style.display='none';
  document.getElementById('app').style.display='flex';
  startBackgroundSync();
}

function startBackgroundSync(){
  setInterval(async ()=>{
    if(!SYNC_URL) return;
    const safeViews = ['myDashboard','myRecords','dashboard','counts','records','supports','agentReviews'];
    if(!safeViews.includes(currentView)) return;
    if(currentView==='agentReviews' && appMode==='support') return;
    if(currentView==='new') return;
    const before = JSON.stringify(STATE);
    await syncNow();
    if(JSON.stringify(STATE) !== before) render();
  }, 45000);
}
init();
